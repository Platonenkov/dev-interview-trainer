name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      previous:
        description: Full SHA of the release that is running; its Release suite is run on the schema this commit migrates to. Empty means the parent of the dispatched commit.
        type: string
        required: false
        default: ""
      enforce:
        description: Fail the release job when Practice exceeds its cold or warm regression budget (docs/performance.md, ADR 0014)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Pushes to main get a group of their own, so none is cancelled and none is dropped from the pending slot.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Some Trainer.Web.Tests run browser scripts under Node; NodeHarness fails them when Node is missing on CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Node version
        run: node --version
      - name: Restore
        run: dotnet restore
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build -warnaserror --no-restore
      - name: Unit and integration tests
        run: dotnet test --no-build --filter-not-trait "Category=E2E" --filter-not-trait "Category=Docker" --filter-not-trait "Category=Release" --ignore-exit-code 8

  # Snippets come from pull requests and are untrusted code: content-checks.yml has no secrets and read-only permissions,
  # and the code runs only inside the throw-away sandbox containers. The same workflow gates deploy-content.
  content:
    needs: build-test
    permissions:
      contents: read
    uses: ./.github/workflows/content-checks.yml

  # The browser checks start the real site over a throw-away PostgreSQL container (Testcontainers, Docker is preinstalled).
  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -warnaserror --no-restore
      - name: Install Playwright Chromium
        run: pwsh tests/Trainer.Web.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: E2E tests
        run: dotnet test --no-build --filter-trait "Category=E2E" --ignore-exit-code 8
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: TestResults/screenshots/**
          if-no-files-found: warn

  # The published Release build (trimmed, fingerprinted, compressed) in a browser, over a migrated PostgreSQL service:
  # the islands boot and round-trip real DTOs, every runtime file loads once and stays cached, and Practice is timed under
  # a phone-over-4G profile against regression budgets (docs/performance.md, ADR 0014). Timings fail the job only when
  # dispatched with enforce = true; the transfer budget always does.
  release:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DIT_RELEASE_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish
      DIT_RELEASE_CONNECTION: Host=localhost;Port=5432;Database=trainer;Username=postgres;Password=release
      DIT_PERF_ENFORCE: ${{ inputs.enforce && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The relink below needs a workload set of the SDK's feature band: SDK 10.0.303 and workload set 10.0.303 move together.
      # global.json asks for 10.0.203 with latestFeature so developers get the newest band, which on ubuntu-latest is the
      # preinstalled SDK (10.0.4xx), not the one setup-dotnet installs. This job-local override, written before any dotnet
      # command, pins the exact SDK; it is never committed.
      - name: Pin the SDK to 10.0.303
        run: |
          jq '.sdk = {version: "10.0.303", rollForward: "disable"}' global.json > global.json.tmp
          mv global.json.tmp global.json
          cat global.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.303
      # The relinked runtime drops what the client does not use (the ICU code under invariant globalization, ADR 0013);
      # without the workload the publish uses the prebuilt runtime, about 0.5 MB larger (docs/performance.md). Pinned to a
      # workload set so the relinked runtime, and so the transfer budget, is reproducible.
      - name: Install wasm-tools
        run: |
          version="$(dotnet --version)"
          echo "SDK $version"
          case "$version" in
            10.0.3??) ;;
            *) echo "::error::The wasm-tools pin needs an SDK in the 10.0.3xx band, got $version"; exit 1 ;;
          esac
          dotnet workload install wasm-tools --version 10.0.303
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -warnaserror --no-restore
      - name: Publish Release
        run: dotnet publish src/Trainer.Web -c Release -o "$DIT_RELEASE_PUBLISH_DIR"
      - name: Restore tools
        run: dotnet tool restore
      # The image comes from deploy/compose/compose.yaml, the single place its digest is pinned, so timing runs are
      # reproducible and a Dependabot bump of the compose pin reaches the tests.
      - name: Start PostgreSQL
        uses: ./.github/actions/postgres-from-compose
      - name: Migrate the database
        run: TRAINER_DB="$DIT_RELEASE_CONNECTION" dotnet ef database update --no-build --project src/Trainer.Infrastructure
      - name: Install Playwright Chromium
        run: pwsh tests/Trainer.Web.Release/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Release tests
        run: dotnet test --no-build --filter-trait "Category=Release" --ignore-exit-code 8
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-perf
          path: |
            TestResults/perf/**
            TestResults/release/**
          if-no-files-found: warn

  # The GitHub Pages build of the site (publish, export, verify, static smoke in a browser), without retention or upload, so
  # the whole build is exercised on every pull request and push and pages.yml only has to deploy what it already proved.
  # Repository variables may be unavailable to pull requests from forks; the fallback is a non-root prefix on a reserved
  # domain, so such a build still runs, and nothing built from it is ever uploaded.
  static-site:
    needs: build-test
    permissions:
      contents: read
    uses: ./.github/workflows/static-site.yml
    with:
      ref: ${{ github.sha }}
      # The sentinel is used whenever no custom domain is set in SITE_URL; this job never uploads, so the address is never published.
      site_url: ${{ vars.SITE_URL || 'https://ci.invalid/fork-build/' }}
      build_id: ${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}
      retain: false
      upload: false

  # The commits the schema check compares. A pull request is tested at GITHUB_SHA, the merge commit of the pull request
  # merge branch (refs/pull/N/merge; GitHub's events documentation: "GITHUB_SHA for this event is the last merge commit of
  # the pull request merge branch"), against the base commit of the pull request. A push to main compares the pushed commit
  # with the one before it. A manual run uses the previous input, or the parent of the dispatched commit when it is empty.
  schema-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.base.outputs.previous }}
      current: ${{ steps.base.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve the commits
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_PREVIOUS: ${{ inputs.previous }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          current="$TESTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            previous="$PULL_REQUEST_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            previous="$EVENT_BEFORE"
            # A push that creates the branch has no before commit; comparing the commit with itself skips the check.
            if [ "$previous" = "0000000000000000000000000000000000000000" ]; then
              previous="$current"
            fi
          else
            previous="$DISPATCH_PREVIOUS"
            if [ -z "$previous" ]; then
              previous="$(git rev-parse HEAD^)"
              echo "No previous input; using the parent of the dispatched commit: $previous"
            else
              echo "Using the previous input: $previous"
            fi
          fi
          if ! [[ "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The previous commit must be a full commit SHA (check the previous input)."
            exit 1
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

  # The release that is running must keep working on the schema the new release migrates to (ADR 0020, schema-compat.yml).
  schema-compat:
    needs: [build-test, schema-base]
    permissions:
      contents: read
    uses: ./.github/workflows/schema-compat.yml
    with:
      previous: ${{ needs.schema-base.outputs.previous }}
      current: ${{ needs.schema-base.outputs.current }}

  # Lints every workflow with actionlint (which runs ShellCheck over each run: script). The release archive is pinned by
  # version and SHA-256 instead of the docker image because it needs no docker pull, and the checksum is verified before
  # the archive is extracted. The checksum is the linux_amd64 line of actionlint_1.7.12_checksums.txt on the release page.
  # pyflakes is not installed on the runner, so the Python check is switched off (-pyflakes=); ShellCheck ships with
  # ubuntu-latest. To upgrade, change both values from the checksums file of the new release.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          # Without file arguments actionlint lints every workflow under .github/workflows of the checkout.
          "$RUNNER_TEMP/actionlint/actionlint" -color -pyflakes=

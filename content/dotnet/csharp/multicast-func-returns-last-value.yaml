locales:
  ru:
    title: Что вернёт вызов Func<int>, в который через += объединены три лямбды?
    prompt: |
      Что выведет эта программа в консоль? В делегат `Func<int>` через `+=` добавлены три лямбды,
      которые возвращают 1, 2 и 3.
    hint: Вызываются ли все методы из списка вызова делегата и какое из возвращённых значений может достаться вызывающему коду, если результат у вызова один?
    options:
      a: "1"
      b: "3"
      c: "6"
      d: "123"
      e: Ошибка компиляции
    optionExplanations:
      a: Лямбды вызываются в порядке добавления, и первая действительно возвращает 1, но её результат отбрасывается. Вызывающему коду достаётся значение последнего делегата в списке вызова.
      c: Делегат не складывает результаты методов из списка вызова. Возвращаемые значения всех методов, кроме последнего, просто отбрасываются.
      d: Результаты не склеиваются в строку. Вызов `getNumber()` возвращает одно значение типа `int`, и `Console.Write` печатает одно число.
      e: Код корректен. Оператор `+=` можно применять к любому типу делегата, в том числе к делегату с возвращаемым значением, таким как `Func<int>`.
    answer: "3"
    explanation: |
      `+=` превращает `getNumber` в многоадресный (multicast) делегат, у которого список вызова состоит из трёх
      лямбд в порядке добавления. При вызове `getNumber()` выполняются все три лямбды по очереди, синхронно. Но у
      вызова делегата только одно возвращаемое значение: по спецификации C# при вызове делегата со списком из
      нескольких методов возвращаемое значение берётся от последнего делегата в списке вызова. Значения 1 и 2
      вычисляются и отбрасываются, поэтому программа печатает `3`.

      На практике многоадресные делегаты с возвращаемым значением почти не используют: результат зависит только
      от последнего подписчика. Если нужны результаты всех методов, список перебирают явно:
      `foreach (Func<int> f in getNumber.GetInvocationList()) { ... f() ... }`. Поведение проверено на .NET 10.
    linkTitles:
      - "Спецификация C#: делегаты"
      - Использование делегатов
      - Объединение делегатов (многоадресные делегаты)
  en:
    title: What does invoking a Func<int> that combines three lambdas with += return?
    prompt: |
      What does this program print to the console? Three lambdas that return 1, 2 and 3 are added
      to a `Func<int>` delegate with `+=`.
    hint: Are all methods in the delegate's invocation list called, and which of their return values can reach the caller when the call has only one result?
    options:
      a: "1"
      b: "3"
      c: "6"
      d: "123"
      e: Compile error
    optionExplanations:
      a: The lambdas are invoked in the order they were added, and the first one does return 1, but its result is discarded. The caller gets the value of the last delegate in the invocation list.
      c: A delegate does not add up the results of the methods in its invocation list. The return values of every method except the last one are simply discarded.
      d: The results are not concatenated into a string. The call `getNumber()` returns a single `int` value, and `Console.Write` prints one number.
      e: The code is valid. The `+=` operator can be applied to any delegate type, including one with a return value such as `Func<int>`.
    answer: "3"
    explanation: |
      `+=` turns `getNumber` into a multicast delegate whose invocation list holds the three lambdas in the order
      they were added. Calling `getNumber()` runs all three lambdas one after another, synchronously. But a delegate
      call has only one return value: according to the C# specification, when a delegate with several methods in
      its invocation list is invoked, the return value comes from the last delegate in the list. The values 1 and 2
      are computed and discarded, so the program prints `3`.

      In practice multicast delegates with a return value are rarely used: the result depends only on the last
      subscriber. If you need the result of every method, walk the list explicitly:
      `foreach (Func<int> f in getNumber.GetInvocationList()) { ... f() ... }`. The behaviour is verified on .NET 10.
    linkTitles:
      - "C# specification: delegates"
      - Using delegates
      - How to combine delegates (multicast delegates)

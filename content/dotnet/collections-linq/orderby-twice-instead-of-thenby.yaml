code:
  language: csharp
  harness: statements
  source: |
    List<Person> people = new()
    {
        new Person("Bob", 30),
        new Person("Anna", 40),
        new Person("Bob", 20),
        new Person("Anna", 25),
    };

    var sorted = people
        .OrderBy(p => p.Age)
        .OrderBy(p => p.Name);

    Console.Write(string.Join(", ", sorted.Select(p => $"{p.Name}:{p.Age}")));

    record Person(string Name, int Age);

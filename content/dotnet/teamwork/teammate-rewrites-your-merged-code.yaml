locales:
  ru:
    title: Коллега раз за разом переписывает ваш уже влитый код и ничего не говорит. Как поступить?
    prompt: |
      За последний месяц коллега из вашей команды трижды переписал части кода, который вы недавно влили в
      основную ветку. Он переименовал классы, перестроил сервис и поменял обработку ошибок. Каждый раз это
      происходило в его собственных пул-реквестах, вас не звали на ревью и не предупреждали. Вы узнаёте об
      этом, когда следующая задача упирается в конфликты слияния или когда код ведёт себя не так, как вы помните.
      Что вы будете делать?
    hint: |
      Какую модель владения кодом использует ваша команда и что именно вы хотите изменить?
    answer: |
      1. **Выяснить, как в команде устроено владение кодом.** Есть ли у модулей закреплённые владельцы или код
         общий; есть ли договорённость о том, когда звать автора или владельца на ревью. При коллективном
         владении любой может менять любой код. При слабом у модуля есть владелец, другие тоже могут его менять,
         но существенное изменение вежливо сначала обсудить с владельцем. Автор недавнего PR не обязательно
         владелец модуля. Если договорённостей нет совсем, это уже часть проблемы.
      2. **Разобраться в фактах и в своей реакции.** Собрать конкретные примеры: ссылки на PR, что именно
         изменилось и к чему это привело (конфликты, неожиданное поведение, потерянное время). Честно оценить
         сами правки: возможно, часть из них действительно улучшила код или исправила то, что пропустило ревью.
      3. **Поговорить наедине.** Не в комментариях к PR и не в общем чате. Описать примеры и их последствия для
         работы без оценок личности («в трёх PR менялся код, который я недавно влил, я узнавал об этом по
         конфликтам, а в одном случае изменилось поведение при ошибке»), затем спросить о причинах: не нравится
         подход, код не соответствует соглашениям команды, не хотелось спорить на ревью.
      4. **Просить о коммуникации, а не о запрете.** Если в команде коллективное владение, коллега вправе менять
         этот код, и просить стоит только об информировании. Если слабое и модуль закреплён за вами, просьба
         обсуждать существенные изменения заранее прямо следует из принятой модели, но запрет на правки - нет.
         В обоих случаях договориться: если правка существенно меняет недавно влитый код, добавить автора в
         ревьюеры или хотя бы написать ему; замечания к подходу высказывать на ревью до слияния, а не
         переписывать код после.
      5. **Превратить договорённость в норму команды.** Поднять тему на ретроспективе как общий вопрос, без
         указания на человека: какую модель владения мы используем, как рефакторим чужой свежий код и как об этом
         сообщаем. Спорные вопросы стиля закрепить в `.editorconfig`, правилах анализаторов или документе с
         соглашениями, чтобы их не решали молчаливым переписыванием.
      6. **Не начинать с отката или эскалации.** Не откатывать его правки и не переписывать код обратно - это
         война правок. К тимлиду идти, только если после разговора и договорённости ничего не меняется и это
         мешает работе команды.
    explanation: |
      Мартин Фаулер описывает три модели владения кодом. При строгом владении модуль закреплён за одним
      человеком, и менять его может только он. При слабом у модуля есть владелец, но другие разработчики тоже
      могут менять его код; владелец следит за чужими изменениями, а существенное изменение вежливо сначала
      обсудить с ним. При коллективном владении код принадлежит всей команде, и любой может менять любую его
      часть. Фаулер считает, что выбор между слабым и коллективным владением зависит от социальной динамики
      команды и что обе модели работают.

      Поэтому первый шаг - понять, какая модель действует. При коллективном владении претензия «он трогает мой
      код» неверна по сути: это код команды, сами правки законны, и проблема только в отсутствии коммуникации.
      При слабом владении правки тоже допустимы, но существенные изменения без разговора с владельцем нарушают
      принятую норму, так что просьба обсуждать их заранее обоснована. Требовать запрета на правки неверно в
      обеих моделях.

      Общее в обоих случаях - потерянная коммуникация. Автор узнаёт о правках по конфликтам слияния, знание о
      том, почему код изменился, теряется, а несогласие по дизайну не высказывается открыто и решается
      молчаливым переписыванием. Именно это и нужно обсуждать.

      Порядок действий важен. Разговор наедине с конкретными примерами даёт коллеге шанс объясниться и не ставит
      его в неловкое положение перед командой. Откат его правок превращает разногласие в войну правок, а жалоба
      руководителю до прямого разговора подрывает доверие и лишает вас возможности решить вопрос самим. Командная
      норма переводит личный конфликт в процесс: правило действует для всех и снимает ощущение, что кто-то
      кого-то контролирует.

      Слабые ответы: молча терпеть и копить раздражение, требовать «не трогать мой код», откатывать правки,
      сразу идти к руководителю.
    linkTitles:
      - "Владение кодом (Мартин Фаулер)"
  en:
    title: A teammate keeps rewriting code you merged without telling you. How do you handle it?
    prompt: |
      Over the last month a teammate has three times rewritten parts of code that you recently merged into the
      main branch. They renamed classes, restructured a service and changed the error handling. Each time it
      happened in their own pull requests, and you were neither added as a reviewer nor told. You find out when
      your next task runs into merge conflicts or when the code behaves differently from what you remember.
      What do you do?
    hint: |
      Which code ownership model does your team follow, and what exactly do you want to be different?
    answer: |
      1. **Find out how code ownership works in the team.** Do modules have assigned owners or is the code
         shared; is there an agreement on when to invite the author or owner to a review. With collective
         ownership anyone may change any code. With weak ownership a module has an owner, others may change it
         too, but it is polite to talk a substantial change over with the owner first. The author of a recent PR
         is not necessarily the owner of the module. If there are no agreements at all, that is already part of
         the problem.
      2. **Sort out the facts and your own reaction.** Collect concrete examples: links to the PRs, what exactly
         changed and what it led to (conflicts, unexpected behaviour, lost time). Judge the changes honestly:
         some of them may really have improved the code or fixed something the review missed.
      3. **Talk in private.** Not in PR comments and not in the team chat. Describe the examples and their effect
         on the work without judging the person ("three PRs changed code I had just merged, I learned about it
         from conflicts, and in one case the error behaviour changed"), then ask about the reasons: they dislike
         the approach, the code does not follow team conventions, they did not want to argue in review.
      4. **Ask for communication, not for a ban.** If the team practices collective ownership, the teammate is
         entitled to change this code, and you can only ask to be kept informed. If it is weak ownership and the
         module is assigned to you, asking to discuss substantial changes first follows directly from the model,
         but a ban on changes does not. In both cases agree: if a change substantially reworks recently merged
         code, add the author as a reviewer or at least message them; raise objections to the approach in review
         before the merge instead of rewriting the code afterwards.
      5. **Turn the agreement into a team norm.** Raise the topic in a retrospective as a general question, without
         pointing at the person: which ownership model we use, how we refactor someone else's fresh code and how
         we announce it. Settle disputed style questions in `.editorconfig`, analyzer rules or a conventions
         document so that they are not decided by silent rewriting.
      6. **Do not start with a revert or an escalation.** Do not revert their changes or rewrite the code back -
         that is an edit war. Go to the team lead only if nothing changes after the conversation and the agreement
         and it hurts the team's work.
    explanation: |
      Martin Fowler describes three models of code ownership. With strong ownership a module belongs to one
      person and only they may change it. With weak ownership a module has an owner, but other developers may
      change its code too; the owner keeps an eye on changes by others, and it is polite to talk a substantial
      change over with the owner first. With collective ownership the code belongs to the whole team and anyone
      may change any part of it. Fowler considers the choice between weak and collective ownership a matter of
      the team's social dynamics and says both work.

      So the first step is to find out which model applies. Under collective ownership the complaint "they touch
      my code" is wrong in substance: it is the team's code, the changes are legitimate, and the only problem is
      the missing communication. Under weak ownership the changes are allowed too, but substantial changes made
      without talking to the owner break the agreed norm, so asking to discuss them first is reasonable.
      Demanding a ban on changes is wrong under both models.

      What both cases share is the lost communication. The author learns about the changes from merge conflicts,
      the knowledge of why the code changed is lost, and a design disagreement is not voiced openly but settled
      by silent rewriting. That is what needs to be discussed.

      The order matters. A private conversation with concrete examples gives the teammate a chance to explain and
      does not embarrass them in front of the team. Reverting their changes turns a disagreement into an edit war,
      and complaining to the manager before talking directly damages trust and takes away your chance to solve it
      yourselves. A team norm turns a personal conflict into a process: the rule applies to everyone and removes
      the feeling that someone is policing someone else.

      Weak answers: putting up with it silently while the irritation builds, demanding "do not touch my code",
      reverting the changes, going straight to the manager.
    linkTitles:
      - "Code Ownership (Martin Fowler)"

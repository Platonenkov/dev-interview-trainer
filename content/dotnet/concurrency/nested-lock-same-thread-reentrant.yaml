code:
  language: csharp
  harness: statements
  source: |
    object gate = new();
    int total = 0;

    void Add(int amount)
    {
        lock (gate)
        {
            total += amount;
        }
    }

    lock (gate)
    {
        Add(10);
        Add(5);
        Console.Write($"total {total}");
    }
expect:
  kind: output
  value: "total 15"
acceptedOutputs: ["total 15"]
options:

tags: [synchronization-context, deadlock, winforms]
code:
  language: csharp
  harness: none
  source: |
    private void Button_Click(object sender, EventArgs e)
    {
        string text = LoadAsync().Result;
        label.Text = text;
    }

    private static async Task<string> LoadAsync()
    {
        await Task.Delay(100);
        return "done";
    }
options:
  - id: a

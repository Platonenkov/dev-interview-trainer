code:
  language: csharp
  harness: statements
  source: |
    Person original = new Person("Anna", 30);
    Person copy = original with { Age = 31 };

    Console.Write($"{original.Age} {copy.Age}");

    record Person(string Name, int Age);
expect:
  kind: output
  value: "30 31"

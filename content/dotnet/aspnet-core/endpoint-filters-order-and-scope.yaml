locales:
  ru:
    title: Какие утверждения о фильтрах конечных точек в minimal API верны?
    prompt: |
      Команда добавляет проверку входных данных к конечным точкам minimal API в приложении на ASP.NET Core 10.
      Выберите все верные утверждения.
    hint: Через какой конвейер проходит запрос к обработчику `MapGet` и чем он отличается от конвейера действий контроллера?
    options:
      a: Фильтр, добавленный через `AddEndpointFilter`, может вернуть результат (например, `Results.Problem(...)`), не вызывая `next`, и тогда обработчик конечной точки не выполняется.
      b: Если к обработчику добавлены фильтры A, B и C в этом порядке, код до вызова `next` выполняется в порядке A, B, C, а код после `next` - в порядке C, B, A.
      c: Класс, реализующий `IEndpointFilter`, нужно сначала зарегистрировать в DI (например, `AddScoped<MyFilter>()`), иначе `AddEndpointFilter<MyFilter>()` не сработает.
      d: Глобальный фильтр действий, добавленный в `MvcOptions.Filters` через `AddControllers(options => options.Filters.Add<MyActionFilter>())`, выполняется и для конечных точек `MapGet`.
      e: "`AddEndpointFilter` можно вызвать на результате `MapControllers()`, чтобы та же логика фильтра выполнялась и для действий контроллеров."
    optionExplanations:
      c: Документация прямо говорит, что фильтр может получать зависимости из DI через конструктор, но сам фильтр из DI не разрешается. Регистрировать его как сервис не нужно.
      d: Фильтры MVC выполняются в конвейере вызова действий, который запускается после выбора действия контроллера или Razor Page, а глобальные фильтры из `MvcOptions.Filters` применяются к контроллерам, действиям и Razor Pages. Обработчик `MapGet` не является действием MVC, поэтому такой фильтр для него не выполняется; для minimal API нужен фильтр конечной точки.
    answer: Верны a, b и e.
    explanation: |
      Фильтр конечной точки получает `EndpointFilterInvocationContext` (контекст запроса и аргументы обработчика) и
      делегат `next`, который вызывает следующий фильтр или сам обработчик. Если фильтр возвращает результат без
      вызова `next`, цепочка дальше не идёт: так в документации фильтр возвращает `Results.Problem` для
      недопустимого значения.

      Несколько фильтров вкладываются друг в друга: код до `next` выполняется в порядке регистрации (FIFO), код
      после `next` - в обратном (FILO). Класс с `IEndpointFilter` может принимать зависимости через конструктор, но
      сам из DI не разрешается. `AddEndpointFilter` работает и на `MapControllers()`, поэтому одну и ту же логику
      можно применить к обработчикам minimal API и к действиям контроллеров.

      Фильтры MVC, в том числе глобальные из `MvcOptions.Filters`, относятся к конвейеру действий MVC и к
      обработчикам minimal API не применяются. Описанное поведение проверено по документации ASP.NET Core 10.
    linkTitles:
      - "Фильтры в приложениях minimal API"
      - "Фильтры в ASP.NET Core"
  en:
    title: Which statements about endpoint filters in minimal APIs are true?
    prompt: |
      A team adds input checks to minimal API endpoints in an ASP.NET Core 10 application.
      Select all true statements.
    hint: Which pipeline does a request to a `MapGet` handler go through, and how does it differ from the controller action pipeline?
    options:
      a: A filter added with `AddEndpointFilter` can return a result (for example `Results.Problem(...)`) without calling `next`, and then the endpoint handler does not run.
      b: If filters A, B and C are added to a handler in that order, the code before `next` runs in the order A, B, C, and the code after `next` runs in the order C, B, A.
      c: A class that implements `IEndpointFilter` must first be registered in DI (for example `AddScoped<MyFilter>()`), otherwise `AddEndpointFilter<MyFilter>()` does not work.
      d: A global action filter added to `MvcOptions.Filters` with `AddControllers(options => options.Filters.Add<MyActionFilter>())` also runs for `MapGet` endpoints.
      e: "`AddEndpointFilter` can be called on the result of `MapControllers()` so that the same filter logic also runs for controller actions."
    optionExplanations:
      c: The documentation states that a filter can resolve its dependencies from DI through its constructor, but the filter itself is not resolved from DI. It does not need to be registered as a service.
      d: MVC filters run in the action invocation pipeline, which starts after a controller action or Razor Page is selected, and global filters in `MvcOptions.Filters` apply to controllers, actions and Razor Pages. A `MapGet` handler is not an MVC action, so such a filter does not run for it; a minimal API needs an endpoint filter.
    answer: a, b and e are true.
    explanation: |
      An endpoint filter receives an `EndpointFilterInvocationContext` (the request context and the handler
      arguments) and a `next` delegate that calls the next filter or the handler itself. If the filter returns a
      result without calling `next`, the chain stops there: the documentation shows a filter that returns
      `Results.Problem` for a value it does not allow.

      Several filters nest inside each other: the code before `next` runs in registration order (FIFO), the code
      after `next` in reverse order (FILO). An `IEndpointFilter` class can take dependencies through its constructor,
      but it is not resolved from DI itself. `AddEndpointFilter` also works on `MapControllers()`, so the same logic
      can be applied to minimal API handlers and to controller actions.

      MVC filters, including global ones from `MvcOptions.Filters`, belong to the MVC action pipeline and are not
      applied to minimal API handlers. The behaviour described is checked against the ASP.NET Core 10 documentation.
    linkTitles:
      - "Filters in Minimal API apps"
      - "Filters in ASP.NET Core"

grading: auto
tags: [boxing, struct, interfaces, mutable-struct, generics]
code:
  language: csharp
  harness: statements
  source: |
    Counter c = new Counter();
    ICounter boxed = c;
    boxed.Inc();
    boxed.Inc();
    c.Inc();
    Console.Write($"{boxed.Count} {c.Count}");

    interface ICounter
    {
        int Count { get; }
        void Inc();
    }

    struct Counter : ICounter
    {
        public int Count { get; private set; }
        public void Inc() => Count++;
    }
expect:
  kind: output
  value: "2 1"
acceptedOutputs: ["2 1"]
options:

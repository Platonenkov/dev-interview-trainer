id: 01M7SVY6RRQMBF1JFPXH740TA7
slug: struct-copy-shares-array-field
stack: dotnet
topic: types-memory
level: junior
type: output
grading: auto
tags: [struct, value-types, reference-types, shallow-copy, arrays]
code:
  language: csharp
  harness: statements
  source: |
    Holder original = new Holder { Count = 1, Items = new int[] { 1, 2, 3 } };
    Holder copy = original;

    copy.Count = 5;
    copy.Items[0] = 9;

    Console.Write($"{original.Count} {original.Items[0]}");

    struct Holder
    {
        public int Count;
        public int[] Items;
    }
expect:
  kind: output
  value: "1 9"
acceptedOutputs: ["1 9"]
options:
  - id: a
    correct: true
    expect: { kind: output, value: "1 9" }
  - id: b
    correct: false
    expect: { kind: output, value: "5 9" }
  - id: c
    correct: false
    expect: { kind: output, value: "1 1" }
  - id: d
    correct: false
    expect: { kind: compile-error }

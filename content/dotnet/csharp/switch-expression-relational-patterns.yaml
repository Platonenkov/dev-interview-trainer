code:
  language: csharp
  harness: statements
  source: |
    int temperature = 15;

    string description = temperature switch
    {
        < 0 => "freezing",
        < 20 => "cool",
        _ => "warm"
    };

    Console.Write(description);
expect:
  kind: output
  value: "cool"
acceptedOutputs: ["cool"]

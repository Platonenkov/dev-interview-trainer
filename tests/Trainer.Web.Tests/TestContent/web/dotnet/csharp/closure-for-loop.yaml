tags: [closures, lambda, for-loop]
code:
  language: csharp
  harness: statements
  source: |
    var actions = new List<Action>();
    for (int i = 0; i < 3; i++)
    {
        actions.Add(() => Console.Write(i));
    }

    foreach (Action action in actions)
    {
        action();
    }
expect:
  kind: output
  value: "333"
acceptedOutputs: ["333"]
options:
  - id: a
    correct: false
    expect: { kind: output, value: "012" }
  - id: b
    correct: true
    expect: { kind: output, value: "333" }
  - id: c
    correct: false
    expect: { kind: output, value: "222" }
links:
  - url: https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/lambda-expressions#capture-of-outer-variables-and-variable-scope-in-lambda-expressions

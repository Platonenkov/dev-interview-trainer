  source: |
    @page "/theme"
    @rendermode InteractiveServer
    @inject IJSRuntime JS

    <p>Theme: @theme</p>

    @code {
        private string? theme;

        protected override async Task OnInitializedAsync()
        {
            theme = await JS.InvokeAsync<string>("localStorage.getItem", "theme");
        }
    }

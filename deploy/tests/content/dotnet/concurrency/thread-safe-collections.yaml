locales:
  ru:
    title: Какие коллекции безопасны для одновременной записи из нескольких потоков?
    prompt: |
      Выберите все коллекции, в которые можно безопасно добавлять элементы
      из нескольких потоков без внешней синхронизации.
    hint: Подумайте, в каком пространстве имён лежат потокобезопасные коллекции.
    options:
      a: "`ConcurrentQueue<T>`"
      b: "`List<T>`"
      c: "`ConcurrentDictionary<TKey, TValue>`"
      d: "`Dictionary<TKey, TValue>`"
    optionExplanations:
      b: "`List<T>` не потокобезопасен: параллельные `Add` могут потерять элементы или повредить внутренний массив."
      d: "`Dictionary<TKey, TValue>` не потокобезопасен: параллельная запись может нарушить внутренние структуры."
    answer: "`ConcurrentQueue<T>` и `ConcurrentDictionary<TKey, TValue>`."
    explanation: |
      Типы из `System.Collections.Concurrent` рассчитаны на одновременную запись.
      Обычные `List<T>` и `Dictionary<TKey, TValue>` требуют внешней синхронизации, например `lock`.
    linkTitles:
      - Потокобезопасные коллекции
  en:
    title: Which collections are safe for concurrent writes from several threads?
    prompt: |
      Select all collections that can safely take new items
      from several threads without external synchronization.
    hint: Think about the namespace that holds the thread-safe collections.
    options:
      a: "`ConcurrentQueue<T>`"
      b: "`List<T>`"
      c: "`ConcurrentDictionary<TKey, TValue>`"
      d: "`Dictionary<TKey, TValue>`"
    optionExplanations:
      b: "`List<T>` is not thread-safe: parallel `Add` calls can lose items or corrupt the internal array."
      d: "`Dictionary<TKey, TValue>` is not thread-safe: concurrent writes can corrupt its internal structures."
    answer: "`ConcurrentQueue<T>` and `ConcurrentDictionary<TKey, TValue>`."
    explanation: |
      Types from `System.Collections.Concurrent` are built for concurrent writes.
      Plain `List<T>` and `Dictionary<TKey, TValue>` need external synchronization such as `lock`.
    linkTitles:
      - Thread-safe collections

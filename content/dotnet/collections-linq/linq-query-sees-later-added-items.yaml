code:
  language: csharp
  harness: statements
  source: |
    List<int> numbers = new() { 1, 2, 3 };
    IEnumerable<int> evens = numbers.Where(n => n % 2 == 0);

    numbers.Add(4);

    Console.Write(evens.Count());
expect:
  kind: output
  value: "2"
acceptedOutputs: ["2"]

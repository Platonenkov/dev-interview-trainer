code:
  language: csharp
  harness: none
  source: |
    private void LoadButton_Click(object sender, EventArgs e)
    {
        string text = LoadGreetingAsync().Result;
        statusLabel.Text = text;
    }

    private static async Task<string> LoadGreetingAsync()
    {
        await Task.Delay(100);
        return "done";
    }

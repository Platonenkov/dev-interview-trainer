- key: csharp
  locales:
    ru:
      title: Язык C#
      description: Синтаксис, обобщения, делегаты, лямбды, замыкания, записи, сопоставление с образцом, nullable и версии языка.
    en:
      title: C# language
      description: Syntax, generics, delegates, lambdas, closures, records, pattern matching, nullable and language versions.
- key: types-memory
  locales:
    ru:
      title: Типы и память
      description: Типы значений и ссылочные типы, упаковка, проектирование структур, Span<T>, ref и различия между стеком и кучей.
    en:
      title: Types and memory
      description: Value and reference types, boxing, struct design, Span<T>, ref and the difference between stack and heap.
- key: oop-solid
  locales:
    ru:
      title: ООП и SOLID
      description: Инкапсуляция, наследование и композиция, интерфейсы, принципы SOLID, DRY, KISS и YAGNI.
    en:
      title: OOP and SOLID
      description: Encapsulation, inheritance versus composition, interfaces, the SOLID principles, DRY, KISS and YAGNI.
- key: collections-linq
  locales:
    ru:
      title: Коллекции и LINQ
      description: Выбор коллекции и сложность операций, хеширование, IEnumerable и IQueryable, отложенное выполнение запросов.
    en:
      title: Collections and LINQ
      description: Choosing a collection and its complexity, hashing, IEnumerable versus IQueryable and deferred query execution.
- key: async
  locales:
    ru:
      title: async / await
      description: Задачи, конечный автомат, SynchronizationContext, ConfigureAwait, ValueTask, отмена и взаимные блокировки.
    en:
      title: async / await
      description: Tasks, the state machine, SynchronizationContext, ConfigureAwait, ValueTask, cancellation and deadlocks.
- key: concurrency
  locales:
    ru:
      title: Многопоточность
      description: Потоки, пул потоков, блокировки, Interlocked, конкурентные коллекции, каналы и состояния гонки.
    en:
      title: Multithreading
      description: Threads, the thread pool, locks, Interlocked, concurrent collections, channels and race conditions.
- key: clr-gc
  locales:
    ru:
      title: CLR и GC
      description: JIT-компиляция, сборки, поколения сборщика мусора, куча больших объектов, финализация, IDisposable и утечки памяти.
    en:
      title: CLR and GC
      description: JIT compilation, assemblies, garbage collector generations, the large object heap, finalization, IDisposable and memory leaks.
- key: exceptions
  locales:
    ru:
      title: Исключения и диагностика
      description: Проектирование исключений, finally, повторный выброс, логирование, дампы и отладка в production.
    en:
      title: Exceptions and diagnostics
      description: Exception design, finally, rethrowing, logging, dumps and debugging in production.
- key: aspnet-core
  locales:
    ru:
      title: ASP.NET Core
      description: Middleware, время жизни зависимостей в DI, конфигурация, хостинг, minimal API против контроллеров и фильтры.
    en:
      title: ASP.NET Core
      description: Middleware, DI lifetimes, configuration, hosting, minimal APIs versus controllers and filters.
- key: web-api
  locales:
    ru:
      title: Web API и HTTP
      description: REST, коды состояния, версионирование, идемпотентность и HttpClient.
    en:
      title: Web APIs and HTTP
      description: REST, status codes, versioning, idempotency and HttpClient.
- key: grpc-realtime
  locales:
    ru:
      title: gRPC и real-time
      description: Контракты gRPC и Protobuf, дедлайны и потоковая передача, SignalR, WebSockets и Server-Sent Events.
    en:
      title: gRPC and real-time
      description: gRPC and Protobuf contracts, deadlines and streaming, SignalR, WebSockets and Server-Sent Events.
- key: security
  locales:
    ru:
      title: Безопасность
      description: Аутентификация и авторизация, OAuth и OIDC, JWT, OWASP Top 10, управление секретами, CORS и CSRF.
    en:
      title: Security
      description: Authentication and authorization, OAuth and OIDC, JWT, the OWASP Top 10, secrets, CORS and CSRF.
- key: ef-core
  locales:
    ru:
      title: EF Core
      description: Отслеживание изменений, миграции, проблема N+1, стратегии загрузки, транзакции, токены параллелизма и безопасный сырой SQL.
    en:
      title: EF Core
      description: Change tracking, migrations, the N+1 problem, loading strategies, transactions, concurrency tokens and safe raw SQL.
- key: databases
  locales:
    ru:
      title: Базы данных и SQL
      description: Индексы, уровни изоляции, блокировки, нормализация, планы запросов и компромиссы NoSQL.
    en:
      title: Databases and SQL
      description: Indexes, isolation levels, locks, normalization, query plans and NoSQL trade-offs.
- key: testing
  locales:
    ru:
      title: Тестирование
      description: Модульные, интеграционные и сквозные тесты, моки и фейки, проектирование тестов, TDD и тестирование асинхронного кода.
    en:
      title: Testing
      description: Unit, integration and end-to-end tests, mocks versus fakes, test design, TDD and testing async code.
- key: patterns
  locales:
    ru:
      title: Паттерны проектирования
      description: Паттерны GoF в .NET, случаи, когда их применять не стоит, и антипаттерны.
    en:
      title: Design patterns
      description: GoF patterns in .NET, when not to use them, and anti-patterns.
- key: architecture
  locales:
    ru:
      title: Архитектура приложений
      description: Слоистая, чистая и гексагональная архитектуры, DDD, CQRS, модульный монолит против микросервисов.
    en:
      title: Application architecture
      description: Layered, clean and hexagonal architecture, DDD, CQRS, and modular monolith versus microservices.
- key: distributed
  locales:
    ru:
      title: Распределённые системы и сообщения
      description: Очереди, Kafka и RabbitMQ, outbox, саги, повторные попытки, идемпотентность и согласованность данных.
    en:
      title: Distributed systems and messaging
      description: Queues, Kafka and RabbitMQ, the outbox pattern, sagas, retries, idempotency and consistency.
- key: system-design
  locales:
    ru:
      title: Проектирование систем
      description: Проектирование сервисов от требований до развёртывания, масштабирование, кэширование и выбор компромиссов.
    en:
      title: System design
      description: Designing services end to end, scaling, caching and weighing trade-offs.
- key: performance
  locales:
    ru:
      title: Производительность
      description: Профилирование, аллокации, бенчмаркинг, кэширование и пулы объектов.
    en:
      title: Performance
      description: Profiling, allocations, benchmarking, caching and pooling.
- key: devops
  locales:
    ru:
      title: DevOps и наблюдаемость
      description: CI/CD, логирование, метрики, трассировка и стратегии развёртывания.
    en:
      title: DevOps and observability
      description: CI/CD, logging, metrics, tracing and deployment strategies.
- key: cloud-containers
  locales:
    ru:
      title: Облако и контейнеры
      description: Docker-образы для .NET, Kubernetes, конфигурация и секреты в облаке, выбор хостинга в Azure и AWS, масштабирование.
    en:
      title: Cloud and containers
      description: Docker images for .NET, Kubernetes, configuration and secrets in the cloud, Azure and AWS hosting choices and scaling.
- key: ui-dotnet
  locales:
    ru:
      title: UI-фреймворки .NET
      description: "WPF, WinUI и Avalonia: привязка данных, MVVM и модель отрисовки."
    en:
      title: .NET UI frameworks
      description: "WPF, WinUI and Avalonia: data binding, MVVM and the rendering model."
- key: blazor
  locales:
    ru:
      title: Blazor
      description: Режимы отрисовки, компоненты, состояние, взаимодействие с JavaScript и формы.
    en:
      title: Blazor
      description: Render modes, components, state, JavaScript interop and forms.
- key: maui
  locales:
    ru:
      title: .NET MAUI
      description: Раскладки, привязки и MVVM, навигация, платформенный код и жизненный цикл.
    en:
      title: .NET MAUI
      description: Layouts, bindings and MVVM, navigation, platform code and lifecycle.
- key: teamwork
  locales:
    ru:
      title: Командная работа и лидерство
      description: Code review, оценка задач, разбор инцидентов, наставничество, конфликты и процессы разработки.
    en:
      title: Teamwork and leadership
      description: Code review, estimation, incident handling, mentoring, conflict resolution and development process.
- key: behavioral
  locales:
    ru:
      title: Ситуационные и поведенческие вопросы
      description: Вопросы вида «что бы вы сделали, если...», у которых нет единственного технического ответа.
    en:
      title: Situational and behavioral
      description: Questions of the form "what would you do if..." that have no single technical answer.

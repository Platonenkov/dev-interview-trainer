slug: blazor-eventcallback-vs-action-parent-rerender
stack: dotnet
topic: blazor
level: middle
type: single
grading: auto
tags: [blazor, eventcallback, rendering, components]
code:
  language: razor
  harness: none
  source: |
    @* Child.razor *@
    <button @onclick="NotifyWithAction">Action</button>
    <button @onclick="NotifyWithCallback">EventCallback</button>

    @code {
        [Parameter] public Action? OnAction { get; set; }
        [Parameter] public EventCallback OnCallback { get; set; }

        private void NotifyWithAction() => OnAction?.Invoke();
        private Task NotifyWithCallback() => OnCallback.InvokeAsync();
    }

    @* Parent.razor *@
    <p>Clicks: @clicks</p>
    <Child OnAction="Increment" OnCallback="Increment" />

    @code {
        private int clicks;
        private void Increment() => clicks++;
    }
options:
  - id: a
    correct: false
  - id: b
    correct: true
  - id: c
    correct: false
  - id: d
    correct: false

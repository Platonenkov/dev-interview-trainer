id: 01M7AXR1WQDSP9RCRR0GA9RFHV
slug: struct-assignment-copies-value
stack: dotnet
topic: types-memory
level: junior
type: output
grading: auto
tags: [struct, value-types, assignment, copy-semantics]
code:
  language: csharp
  harness: statements
  source: |
    Point p1 = new Point { X = 1 };
    Point p2 = p1;
    p2.X = 5;

    Console.Write($"{p1.X} {p2.X}");

    struct Point
    {
        public int X;
    }
expect:
  kind: output
  value: "1 5"
acceptedOutputs: ["1 5"]
options:
  - id: a
    correct: true
    expect: { kind: output, value: "1 5" }
  - id: b
    correct: false
    expect: { kind: output, value: "5 5" }
  - id: c
    correct: false
    expect: { kind: output, value: "1 1" }
  - id: d
    correct: false
    expect: { kind: compile-error }

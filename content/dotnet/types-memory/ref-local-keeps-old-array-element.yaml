id: 01M7AXR1WQ6C785D62EA48T9DB
slug: ref-local-keeps-old-array-element
stack: dotnet
topic: types-memory
level: middle
type: output
grading: auto
tags: [ref-locals, arrays, managed-pointers]
code:
  language: csharp
  harness: statements
  source: |
    int[] a = { 1, 2, 3 };
    int[] old = a;
    ref int first = ref a[0];

    a = new int[] { 10, 20, 30 };
    first = 99;

    Console.Write($"{a[0]} {old[0]}");
expect:
  kind: output
  value: "10 99"
acceptedOutputs: ["10 99"]
options:
  - id: a
    correct: true
    expect: { kind: output, value: "10 99" }
  - id: b
    correct: false
    expect: { kind: output, value: "99 1" }
  - id: c
    correct: false
    expect: { kind: output, value: "10 1" }
  - id: d
    correct: false
    expect: { kind: compile-error }

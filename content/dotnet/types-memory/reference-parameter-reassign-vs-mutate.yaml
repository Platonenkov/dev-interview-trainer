code:
  language: csharp
  harness: statements
  source: |
    List<int> numbers = new() { 1, 2 };
    Update(numbers);
    Console.Write(numbers.Count);

    static void Update(List<int> list)
    {
        list.Add(3);
        list = new List<int>();
        list.Add(4);
    }
expect:
  kind: output
  value: "3"
acceptedOutputs: ["3"]

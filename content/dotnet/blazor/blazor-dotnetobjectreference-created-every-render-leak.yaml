code:
  language: razor
  harness: none
  source: |
    @page "/regions"
    @rendermode InteractiveServer
    @implements IAsyncDisposable
    @inject IJSRuntime JS

    <div id="region-map"></div>
    <p>Selected: @selected</p>

    @code {
        private string? selected;

        protected override async Task OnAfterRenderAsync(bool firstRender)
        {
            var selfReference = DotNetObjectReference.Create(this);
            await JS.InvokeVoidAsync("regionMap.attach", "region-map", selfReference);
        }

        [JSInvokable]
        public Task OnRegionSelected(string region)
        {
            selected = region;
            return InvokeAsync(StateHasChanged);
        }

        public async ValueTask DisposeAsync()
        {
            try
            {
                await JS.InvokeVoidAsync("regionMap.detach", "region-map");
            }
            catch (JSDisconnectedException)
            {
            }
        }
    }
bugLineSets: [[14], [15], [14, 15]]

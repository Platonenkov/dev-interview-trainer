code:
  language: csharp
  harness: statements
  source: |
    PointClass[] classes =
    {
        new PointClass(1, 2),
        new PointClass(1, 2),
        new PointClass(1, 2)
    };
    PointRecord[] records =
    {
        new PointRecord(1, 2),
        new PointRecord(1, 2),
        new PointRecord(1, 2)
    };

    Console.Write($"{classes.Distinct().Count()} {records.Distinct().Count()}");

    class PointClass
    {
        public PointClass(int x, int y)
        {
            X = x;
            Y = y;
        }

        public int X { get; }
        public int Y { get; }
    }

    record PointRecord(int X, int Y);
expect:
  kind: output
  value: "3 1"
acceptedOutputs: ["3 1"]

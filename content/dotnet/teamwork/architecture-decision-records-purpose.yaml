locales:
  ru:
    title: Зачем нужны записи архитектурных решений (ADR) и как сохранить их полезными на годы?
    prompt: |
      Для чего команде записи архитектурных решений (Architecture Decision Records, ADR)? Что должно быть
      в такой записи, что происходит с ней, когда решение меняется, и как организовать ADR так, чтобы они
      оставались полезными для нескольких команд через годы?
    hint: |
      Подумайте, кто и когда читает запись: что нужно разработчику, который придёт в проект через три года
      и захочет понять, можно ли пересмотреть решение?
    answer: |
      - **Назначение.** ADR фиксирует одно архитектурно значимое решение вместе с его обоснованием: контекст
        и действующие силы на момент решения, само решение и его последствия - положительные, отрицательные
        и нейтральные. Код показывает, *что* построено, а ADR сохраняет, *почему*. Через годы команда может
        проверить, верны ли ещё исходные причины, вместо того чтобы слепо следовать решению или слепо его
        отменять. Набор всех ADR проекта образует журнал решений.
      - **Формат (по Майклу Найгарду).** Короткий текстовый файл на одну-две страницы, одно решение на запись,
        разделы: заголовок, контекст, решение, статус, последствия. Записи нумеруются последовательно, номера
        не используются повторно. Статус: предложено, принято, устарело, заменено. Найгард советует писать
        запись как разговор с будущим разработчиком, полными предложениями. Более подробные шаблоны
        дополнительно фиксируют рассмотренные варианты и причины, по которым их отвергли.
      - **Неизменяемость.** Принятую запись не переписывают под новое решение. Когда решение меняется, пишут
        новую ADR, а старую оставляют и помечают как устаревшую или заменённую со ссылкой на новую. Журнал
        показывает историю рассуждений, а не только итог.
      - **Как сохранить пользу между командами и годами.** Найгард предлагает хранить ADR в репозитории
        проекта (у него это `doc/arch/adr-NNN.md`) в лёгкой разметке вроде Markdown. Остальное - практические
        рекомендации, которые выходят за рамки исходного формата:
        - проводить ADR через то же ревью изменений, что и код; решения, общие для нескольких систем, держать
          в одном доступном репозитории с оглавлением;
        - писать запись в момент принятия решения, а не задним числом; статус «предложено» даёт затронутым
          командам время высказаться до принятия;
        - записывать только значимые решения: влияющие на структуру системы, нефункциональные характеристики,
          зависимости, интерфейсы и способы разработки, а не каждое обновление библиотеки;
        - указывать дату и тех, кто принял решение, ссылаться на ADR из `README` и кода, где это помогает;
        - пересматривать решения при смене контекста (нагрузка, состав команды, поставщик) через новую ADR.
    explanation: |
      В долгоживущей системе быстрее всего теряется не код, а рассуждения, которые к нему привели. Люди уходят,
      переписка в чатах и встречи забываются, и новая команда видит странное решение без объяснения. Тогда
      остаётся два плохих варианта: бояться что-либо менять или переделать, не зная, какую проблему решение
      закрывало. Найгард прямо называет цель ADR: мотивация прошлых решений видна всем, даже когда состав
      команды меняется, а момент для пересмотра становится понятен по изменениям в контексте проекта.

      Обычная документация в вики описывает текущее состояние и устаревает, потому что её никто не обновляет.
      ADR описывает решение на конкретный момент, поэтому её не нужно поддерживать в актуальном состоянии:
      она остаётся верной как запись того, что и почему решили тогда. Поэтому принятые записи не переписывают:
      правка стирает контекст, в котором старое решение было разумным, а пометка «заменено записью N»
      сохраняет историю. К тому же последствия одной ADR часто становятся контекстом для следующих.

      Типичные ошибки: превращать ADR в бюрократический шлюз согласования, писать записи задним числом для
      оправдания уже сделанного, перечислять только плюсы в последствиях, хранить записи там, где их никто не
      найдёт. Для архитектора особенно важен раздел последствий: именно в нём другие команды видят, чего им
      будет стоить решение.
    linkTitles:
      - "Документирование архитектурных решений (Майкл Найгард)"
      - "Сайт Architectural Decision Records"
  en:
    title: What are architecture decision records (ADRs) for, and how do you keep them useful for years?
    prompt: |
      What does a team need Architecture Decision Records (ADRs) for? What should a record contain, what
      happens to it when the decision changes, and how do you organise ADRs so that they stay useful to
      several teams years later?
    hint: |
      Think about who reads a record and when: what does a developer who joins the project three years later
      need in order to judge whether a decision can be revisited?
    answer: |
      - **Purpose.** An ADR records one architecturally significant decision together with its rationale: the
        context and the forces at play at the time, the decision itself and its consequences - positive,
        negative and neutral. Code shows *what* was built; the ADR keeps *why*. Years later a team can check
        whether the original reasons still hold instead of blindly following the decision or blindly reverting
        it. The collection of a project's ADRs forms its decision log.
      - **Format (after Michael Nygard).** A short text file of one or two pages, one decision per record,
        with the sections title, context, decision, status and consequences. Records are numbered sequentially
        and numbers are not reused. Status: proposed, accepted, deprecated, superseded. Nygard advises writing
        each record as a conversation with a future developer, in full sentences. Richer templates also record
        the options considered and why they were rejected.
      - **Immutability.** An accepted record is not rewritten to match a new decision. When the decision
        changes, you write a new ADR and keep the old one, marked as deprecated or superseded with a reference
        to the new one. The log shows the history of the reasoning, not only the outcome.
      - **Keeping them useful across teams and years.** Nygard proposes keeping ADRs in the project repository
        (in his post `doc/arch/adr-NNN.md`) in a lightweight markup such as Markdown. The rest is practical
        advice that goes beyond the original format:
        - pass ADRs through the same change review as the code; keep decisions shared by several systems in
          one discoverable repository with an index;
        - write the record when the decision is made, not after the fact; the proposed status gives affected
          teams time to comment before it is accepted;
        - record only significant decisions: those that affect the structure, non-functional characteristics,
          dependencies, interfaces or construction techniques, not every library upgrade;
        - state the date and who made the decision, and link to ADRs from the `README` and code where it helps;
        - revisit decisions when the context changes (load, team, vendor) by writing a new ADR.
    explanation: |
      In a long-lived system the first thing to be lost is not the code but the reasoning behind it. People
      leave, chat threads and meetings are forgotten, and a new team sees an odd decision with no explanation.
      That leaves two bad options: be afraid to change anything, or redo it without knowing which problem the
      decision solved. Nygard states the goal of ADRs directly: the motivation behind previous decisions is
      visible to everyone even as the team composition changes, and the time to change old decisions becomes
      clear from changes in the project's context.

      Ordinary wiki documentation describes the current state and goes stale because nobody updates it. An
      ADR describes a decision at a point in time, so it does not need to be kept up to date: it stays correct
      as a record of what was decided then and why. That is why accepted records are not rewritten: an edit
      erases the context in which the old decision was reasonable, while the "superseded by record N" marker
      keeps the history. The consequences of one ADR also often become the context of later ones.

      Common mistakes: turning ADRs into a bureaucratic approval gate, writing records after the fact to
      justify what is already done, listing only benefits under consequences, and storing records where nobody
      will find them. For an architect the consequences section matters most: it is where other teams see what
      the decision will cost them.
    linkTitles:
      - "Documenting Architecture Decisions (Michael Nygard)"
      - "Architectural Decision Records website"

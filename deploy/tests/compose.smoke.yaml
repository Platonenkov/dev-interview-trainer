# S3-compatible endpoint for the deployment smoke test: the environment renders BACKUP_S3_* values, and the backup
# scripts (rclone on the host) need something to talk to. Started by smoke.sh as its own project, separate from the
# production Compose project, because the production scripts address exactly one compose file.
name: dit-smoke-s3

services:
  s3:
    # MinIO no longer publishes community images; rclone serves the same S3 subset the backup scripts use.
    image: rclone/rclone:1.70.3@sha256:34c729127386abec1c610b2aa024e39b4498dc2b4a72a0798ae21fbdc1b0493b
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/dit-smoke && exec rclone serve s3 /data --addr :9000 --auth-key "$${SMOKE_S3_ACCESS_KEY},$${SMOKE_S3_SECRET_KEY}"
    environment:
      SMOKE_S3_ACCESS_KEY: ${SMOKE_S3_ACCESS_KEY:?SMOKE_S3_ACCESS_KEY is required}
      SMOKE_S3_SECRET_KEY: ${SMOKE_S3_SECRET_KEY:?SMOKE_S3_SECRET_KEY is required}
    # The backup scripts reach it through s3-no-read-proxy.py on 9000, which enforces the server key's "list and write, no
    # read, no delete" policy; smoke.sh itself uses 9001 directly with the full-rights key.
    ports:
      - "127.0.0.1:9001:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 2s
      timeout: 2s
      retries: 15

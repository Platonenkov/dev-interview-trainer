version: 2
updates:
  # Keeps the full-SHA pins of actions current; the hardening tests require every remote action to be pinned.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version needs a dump and restore, not an image bump. The digest in compose.yaml is the
      # only one: ci.yml and schema-compat.yml read it from there (.github/actions/postgres-from-compose), so a digest bump
      # reaches the tests with no second edit.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Pinned to an exact version: upgrades follow the manual "Umami upgrade" procedure in docs/deployment.md.
      - dependency-name: "*umami*"

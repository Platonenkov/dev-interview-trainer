code:
  language: csharp
  harness: statements
  source: |
    Point[] array = { new Point { X = 1 } };
    List<Point> list = new() { new Point { X = 1 } };

    array[0].X = 5;
    list[0].X = 5;

    Console.Write($"{array[0].X} {list[0].X}");

    struct Point
    {
        public int X;
    }
expect:
  kind: compile-error
  value: CS1612

code:
  language: csharp
  harness: statements
  source: |
    Dictionary<string, int> values = new(StringComparer.OrdinalIgnoreCase);
    values["Key"] = 1;
    values["KEY"] = 2;

    Console.Write($"{values.Count} {values["Key"]}");
expect:
  kind: output
  value: "1 2"
acceptedOutputs: ["1 2"]

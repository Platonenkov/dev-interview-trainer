code:
  language: csharp
  harness: statements
  source: |
    try
    {
        try
        {
            throw new InvalidOperationException();
        }
        catch (InvalidOperationException)
        {
            Console.Write("catch ");
            throw;
        }
        finally
        {
            Console.Write("finally ");
        }
    }
    catch (InvalidOperationException)
    {
        Console.Write("outer");
    }

tags: [async-await, task, synchronous-completion]
code:
  language: csharp
  harness: statements
  source: |
    Task task = PrintAsync();
    Console.Write("4");
    await task;
    Console.Write("3");

    async Task PrintAsync()
    {
        Console.Write("1");
        await Task.CompletedTask;
        Console.Write("2");
    }
expect:
  kind: output
  value: "1243"

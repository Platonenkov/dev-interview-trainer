slug: monitor-enter-boxed-int
stack: dotnet
topic: concurrency
level: middle
type: find-bug
grading: auto
tags: [monitor, locks, boxing, synchronization-lock-exception]
code:
  language: csharp
  harness: statements
  source: |
    Counter counter = new();
    counter.Add(5);
    Console.WriteLine(counter.Total);

    class Counter
    {
        private int count;

        public int Total => count;

        public void Add(int amount)
        {
            Monitor.Enter(count);
            try
            {
                count += amount;
            }
            finally
            {
                Monitor.Exit(count);
            }
        }
    }
bugLineSets: [[13, 20], [13], [20]]
fixedSource: |
  Counter counter = new();
  counter.Add(5);
  Console.WriteLine(counter.Total);

  class Counter
  {
      private readonly object gate = new();
      private int count;

      public int Total
      {
          get
          {
              lock (gate)
              {
                  return count;
              }
          }
      }

      public void Add(int amount)
      {
          lock (gate)
          {
              count += amount;
          }
      }
  }
fixedExpect: { kind: output, value: "5" }

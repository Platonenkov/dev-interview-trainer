code:
  language: csharp
  harness: statements
  source: |
    A a1 = new A(1);
    A a2 = new A(1);
    A b = new B(1);

    Console.Write($"{a1 == a2} {a1 == b} {b == a1}");

    record A(int X);
    record B(int X) : A(X);
expect:
  kind: output
  value: "True False False"

    // dbo.Accounts: AccountNumber varchar(20) NOT NULL, Balance decimal(18, 2) NOT NULL
    // IX_Accounts_AccountNumber ON dbo.Accounts (AccountNumber); column collation SQL_Latin1_General_CP1_CI_AS
    public async Task<decimal?> GetBalanceAsync(SqlConnection connection, string accountNumber)
    {
        const string sql = "SELECT Balance FROM dbo.Accounts WHERE AccountNumber = @accountNumber";
        await using var command = new SqlCommand(sql, connection);
        command.Parameters.Add("@accountNumber", SqlDbType.NVarChar, 20).Value = accountNumber;
        return (decimal?)await command.ExecuteScalarAsync();
    }

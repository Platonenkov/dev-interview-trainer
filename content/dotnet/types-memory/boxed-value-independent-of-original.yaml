code:
  language: csharp
  harness: statements
  source: |
    int number = 10;
    object boxed = number;

    number = 20;

    Console.Write($"{boxed} {number}");
expect:
  kind: output
  value: "10 20"
acceptedOutputs: ["10 20"]

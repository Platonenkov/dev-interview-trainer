  source: |
    @page "/clock"
    @rendermode InteractiveServer
    @implements IDisposable

    <p>Ticks: @ticks</p>

    @code {
        private int ticks;
        private System.Threading.Timer? timer;

        protected override void OnInitialized()
        {
            timer = new System.Threading.Timer(_ =>
            {
                ticks++;
                StateHasChanged();
            }, null, 1000, 1000);
        }

        public void Dispose() => timer?.Dispose();
    }

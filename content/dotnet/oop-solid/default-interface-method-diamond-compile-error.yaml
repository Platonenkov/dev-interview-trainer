code:
  language: csharp
  harness: statements
  source: |
    IA item = new D();
    item.M();

    interface IA
    {
        void M();
    }

    interface IB : IA
    {
        void IA.M() => Console.Write("IB");
    }

    interface IC : IA
    {
        void IA.M() => Console.Write("IC");
    }

    class D : IB, IC
    {
    }
expect:
  kind: compile-error
  value: CS8705

locales:
  ru:
    title: Когда @bind в Blazor обновляет поле компонента при вводе текста?
    prompt: |
      В компоненте Blazor поле ввода привязано к полю `searchText` через `@bind` без дополнительных модификаторов.
      Пользователь печатает `abc` и пока не уходит из поля. Когда обновится `searchText`, а вместе с ним
      текст в абзаце под полем?
    hint: "На какое событие DOM подписывается `@bind` по умолчанию и когда браузер генерирует это событие для текстового поля?"
    options:
      a: "На каждое нажатие клавиши, сразу после ввода символа"
      b: "Когда браузер генерирует событие `change`: обычно когда поле теряет фокус после изменения значения"
      c: "Только при отправке формы, в которой находится поле"
      d: "Никогда: `@bind` задаёт одностороннюю привязку, и значение из поля ввода в поле компонента не попадает"
    optionExplanations:
      a: 'Обновление на каждое нажатие даёт событие `input`, а `@bind` по умолчанию слушает `change`. Для такого поведения нужен `@bind:event="oninput"`.'
      c: "Привязка не зависит от формы: `@bind` обрабатывает событие `change` самого поля, даже если поле не находится внутри формы."
      d: "`@bind` - двусторонняя привязка: он заполняет атрибут `value` из поля компонента и добавляет обработчик события, который записывает введённое значение обратно."
    answer: "Когда срабатывает событие `change`: обычно после того, как поле с изменённым значением потеряло фокус."
    explanation: |
      Для элемента `<input>` директива `@bind` разворачивается в две вещи: атрибут `value`, который заполняется из
      поля компонента, и обработчик события `onchange`, который записывает значение элемента обратно в поле.
      Браузер генерирует `change` для текстового поля не на каждый символ, а когда пользователь завершил правку,
      обычно при потере фокуса. Поэтому, пока курсор остаётся в поле, `searchText` и абзац не меняются.

      Чтобы значение обновлялось на каждое нажатие клавиши, событие указывают явно: `@bind:event="oninput"`.
      Это удобно для поиска по мере ввода, но каждое событие запускает обработчик и перерисовку компонента, а в
      режиме Interactive Server ещё и отправку сообщения на сервер.
    linkTitles:
      - "Привязка данных в ASP.NET Core Blazor"
  en:
    title: When does @bind in Blazor update the component field as the user types?
    prompt: |
      In a Blazor component an input is bound to the field `searchText` with `@bind` and no extra modifiers.
      The user types `abc` and stays in the input. When are `searchText` and the paragraph below the input
      updated?
    hint: "Which DOM event does `@bind` subscribe to by default, and when does the browser raise it for a text input?"
    options:
      a: "On every keystroke, right after each character is typed"
      b: "When the browser raises the `change` event: typically when the input loses focus after its value was edited"
      c: "Only when the form that contains the input is submitted"
      d: "Never: `@bind` is a one-way binding, so the value never flows from the input to the component field"
    optionExplanations:
      a: 'An update on every keystroke comes from the `input` event, while `@bind` listens to `change` by default. That behavior needs `@bind:event="oninput"`.'
      c: "The binding does not depend on a form: `@bind` handles the `change` event of the input itself, even when the input is not inside a form."
      d: "`@bind` is a two-way binding: it fills the `value` attribute from the component field and adds an event handler that writes the entered value back."
    answer: "When the `change` event fires: typically after the edited input loses focus."
    explanation: |
      For an `<input>` element the `@bind` directive expands into two things: a `value` attribute filled from
      the component field, and an `onchange` handler that writes the element value back into the field. The
      browser raises `change` for a text input not on every character but when the user has finished editing,
      usually when the input loses focus. So while the cursor stays in the input, `searchText` and the
      paragraph do not change.

      To update the value on every keystroke, name the event explicitly: `@bind:event="oninput"`. This suits
      search-as-you-type, but every event runs the handler and re-renders the component, and in the
      Interactive Server render mode it also sends a message to the server.
    linkTitles:
      - "ASP.NET Core Blazor data binding"

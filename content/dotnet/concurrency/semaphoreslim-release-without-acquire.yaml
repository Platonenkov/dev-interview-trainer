slug: semaphoreslim-release-without-acquire
stack: dotnet
topic: concurrency
level: senior
type: find-bug
grading: auto
tags: [semaphoreslim, locks, semaphore-full-exception, try-finally]
code:
  language: csharp
  harness: statements
  source: |
    SemaphoreSlim gate = new(1, 1);
    int saved = 0;

    void Save(bool nested)
    {
        bool acquired = gate.Wait(0);
        try
        {
            if (!acquired)
            {
                Console.WriteLine("busy, skipped");
                return;
            }
            if (nested)
            {
                Save(false);
            }
            saved++;
        }
        finally
        {
            gate.Release();
        }
    }

    Save(true);
    Console.WriteLine(saved);
bugLineSets: [[22]]
fixedSource: |
  SemaphoreSlim gate = new(1, 1);
  int saved = 0;

  void Save(bool nested)
  {
      if (!gate.Wait(0))
      {
          Console.WriteLine("busy, skipped");
          return;
      }
      try
      {
          if (nested)
          {
              Save(false);
          }
          saved++;
      }
      finally
      {
          gate.Release();
      }
  }

  Save(true);
  Console.WriteLine(saved);
fixedExpect: { kind: output, value: "busy, skipped\n1" }

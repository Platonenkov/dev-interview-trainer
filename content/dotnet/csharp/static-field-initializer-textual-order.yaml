slug: static-field-initializer-textual-order
stack: dotnet
topic: csharp
level: senior
type: find-bug
grading: auto
tags: [static-fields, type-initializer, initialization-order]
code:
  language: csharp
  harness: statements
  source: |
    Console.WriteLine(Currency.FromCode("EUR").Name);

    sealed class Currency
    {
        public static readonly Currency Usd = new("USD", "US dollar");
        public static readonly Currency Eur = new("EUR", "Euro");

        private static readonly Dictionary<string, Currency> ByCode = new();

        private Currency(string code, string name)
        {
            Code = code;
            Name = name;
            ByCode.Add(code, this);
        }

        public string Code { get; }
        public string Name { get; }

        public static Currency FromCode(string code) => ByCode[code];
    }
expect: { kind: exception, value: System.TypeInitializationException }
bugLineSets: [[8], [5, 6]]
fixedSource: |
  Console.WriteLine(Currency.FromCode("EUR").Name);

  sealed class Currency
  {
      private static readonly Dictionary<string, Currency> ByCode = new();

      public static readonly Currency Usd = new("USD", "US dollar");
      public static readonly Currency Eur = new("EUR", "Euro");

      private Currency(string code, string name)
      {
          Code = code;
          Name = name;
          ByCode.Add(code, this);
      }

      public string Code { get; }
      public string Name { get; }

      public static Currency FromCode(string code) => ByCode[code];
  }
fixedExpect: { kind: output, value: "Euro" }

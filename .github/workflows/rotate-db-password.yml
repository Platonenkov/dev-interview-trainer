name: rotate-db-password

# Rotates the password of one database role (trainer or umami) on the production server and in the matching secret of the
# production environment, rolling forward only: the server journals the new value first (.rotation-pending), changes the
# role, .env and last-good.env, and the GitHub secret is updated before the journal is committed. There is no revert.
#
# While the journal exists every deployment, content delivery and backup on the server refuses and ops-check fails
# "guards". When a run fails or is cancelled after the server changed, run this workflow again with mode "finish" and the
# same role: it converges the server, updates the secret and commits, and is safe to repeat.
#
# SECRETS_ADMIN_TOKEN (secret of the production environment) is a fine-grained token for this repository with the
# Environments permission "read and write"; GITHUB_TOKEN cannot write secrets. The first step proves it works before
# anything is changed.
on:
  workflow_dispatch:
    inputs:
      role:
        description: Database role to rotate.
        type: choice
        required: true
        options:
          - trainer
          - umami
      mode:
        description: rotate starts a new rotation; finish resumes an interrupted one (the role must match the pending rotation).
        type: choice
        required: true
        default: rotate
        options:
          - rotate
          - finish

permissions: {}

concurrency:
  group: production-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      APP_DIR: ${{ vars.APP_DIR }}
      ROLE: ${{ inputs.role }}
      MODE: ${{ inputs.mode }}
      REF_NAME: ${{ github.ref }}
      STAGE_ID: rotate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the inputs
        run: |
          set -euo pipefail
          # The scripts that run on the server come from the commit this workflow runs at, so it must be main.
          [ "$REF_NAME" = "refs/heads/main" ] || { echo "::error::Run this workflow from main."; exit 1; }
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]*$ ]] || { echo "::error::The APP_DIR variable must be an absolute path."; exit 1; }
          case "$ROLE" in trainer | umami) ;; *) echo "::error::The role must be trainer or umami."; exit 1 ;; esac
          case "$MODE" in rotate | finish) ;; *) echo "::error::The mode must be rotate or finish."; exit 1 ;; esac
          echo "STAGE=$APP_DIR/staging/$STAGE_ID" >> "$GITHUB_ENV"
      # Nothing has changed yet: a token that cannot write environment secrets must end the run here, not after the
      # database role has a password that GitHub does not know.
      - name: Check that the secrets token can write environment secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          printf 'check' | gh secret set DIT_TOKEN_CHECK --env production --repo "$GITHUB_REPOSITORY"
          gh secret delete DIT_TOKEN_CHECK --env production --repo "$GITHUB_REPOSITORY"
      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      - name: Upload the bundle into the staging directory
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit)
          "${ssh_cmd[@]}" "mkdir -p '$APP_DIR/staging' && mkdir -m 700 '$STAGE' '$STAGE/bundle'"
          tar -czf - -C deploy --exclude='./tests' . | "${ssh_cmd[@]}" "tar -xzpf - -C '$STAGE/bundle'"
      # The new value exists only in a file of mode 600 under $RUNNER_TEMP/env and reaches the server on stdin; it is never an
      # argument, never printed and never part of the script text.
      - name: Generate the new password and begin the rotation
        if: ${{ inputs.mode == 'rotate' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/env"
          pw="$(openssl rand -hex 24)" || { echo "::error::The password generator failed. Nothing was changed."; exit 1; }
          [[ "$pw" =~ ^[0-9a-f]{48}$ ]] || { echo "::error::The password generator returned an unexpected value. Nothing was changed."; exit 1; }
          echo "::add-mask::$pw"
          printf '%s' "$pw" > "$RUNNER_TEMP/env/new-password"
          code=0
          ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit "APP_DIR='$APP_DIR' bash '$STAGE/bundle/remote/rotate-db-password.sh' '$STAGE' '$ROLE' begin" < "$RUNNER_TEMP/env/new-password" || code=$?
          case "$code" in
            0) ;;
            3) echo "::error::A guard file refuses the rotation. If .rotation-pending exists, run this workflow with mode finish for the pending role."; exit 1 ;;
            2) echo "::error::The rotation was refused before anything was journaled (exit 2); nothing changed. Fix the cause and run mode rotate again."; exit 1 ;;
            255) echo "::error::The connection to the server failed (ssh exit 255) and the state is unknown. Run this workflow again: if a rotation was journaled meanwhile, the server refuses with a guard message that points to mode finish."; exit 1 ;;
            *) echo "::error::The rotation did not finish on the server (exit $code). If a pending rotation exists, run this workflow again with mode finish and the same role; if finish reports none, nothing was journaled and mode rotate can be run again."; exit 1 ;;
          esac
      - name: Verify the pending role and finish the interrupted rotation
        if: ${{ inputs.mode == 'finish' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/env"
          ssh_cmd=(ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit)
          pending="$("${ssh_cmd[@]}" "APP_DIR='$APP_DIR' bash '$STAGE/bundle/remote/rotate-db-password.sh' '$STAGE' pending-role")"
          [ "$pending" = "$ROLE" ] || { echo "::error::The pending rotation is for '$pending', not '$ROLE'. Nothing was changed."; exit 1; }
          "${ssh_cmd[@]}" "APP_DIR='$APP_DIR' bash '$STAGE/bundle/remote/rotate-db-password.sh' '$STAGE' '$ROLE' finish"
          # The value is already in .env on the server, so reading it back over the SSH channel exposes nothing new. Role and
          # value come from the same read, and the role must still be the verified one before the value is used.
          journal="$("${ssh_cmd[@]}" "cat '$APP_DIR/.rotation-pending'")"
          pw="$(sed -n "s/^ROTATION_PASSWORD='\([A-Za-z0-9._~-]*\)'\$/\1/p" <<<"$journal")"
          journal_role="$(sed -n "s/^ROTATION_ROLE='\([a-z]*\)'\$/\1/p" <<<"$journal")"
          unset journal
          [[ "$pw" =~ ^[A-Za-z0-9._~-]{32,128}$ ]] || { echo "::error::The pending password could not be read back."; exit 1; }
          echo "::add-mask::$pw"
          [ "$journal_role" = "$ROLE" ] || { echo "::error::The pending rotation changed to '$journal_role' while this run was working. Nothing was published."; exit 1; }
          printf '%s' "$pw" > "$RUNNER_TEMP/env/new-password"
      - name: Update the environment secret
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # The name comes from the role alone, and the role was verified against the server's journal above.
          case "$ROLE" in
            trainer) name=DB_PASSWORD ;;
            umami) name=UMAMI_DB_PASSWORD ;;
            *) echo "::error::The role must be trainer or umami."; exit 1 ;;
          esac
          ok=0
          for attempt in 1 2 3; do
            if gh secret set "$name" --env production --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/env/new-password"; then
              ok=1
              break
            fi
            echo "::warning::Updating $name failed (attempt $attempt of 3)."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::$name was not confirmed. The server keeps the pending rotation and refuses deployments; run this workflow again with mode finish and role $ROLE."
            exit 1
          fi
      # Reached only when the secret was confirmed: the journal is the only thing that blocks deployments on the server.
      - name: Commit the rotation on the server
        run: ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit "APP_DIR='$APP_DIR' bash '$STAGE/bundle/remote/rotate-db-password.sh' '$STAGE' '$ROLE' commit"
      # The deployments refused while the rotation was pending are not retried by anyone else. The commit that runs is
      # redeployed, not the tip of main: the tip may have a red ci run, and deploy-app does not check ci for an explicit ref.
      # keep_hold stops this dispatch from releasing the hold that a rollback set.
      - name: Dispatch deploy-app for the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! record="$(ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit "grep -E '^DIT_COMMIT=' '$APP_DIR/last-good.env' || true")"; then
            echo "::error::The rotation is committed; only reading the deployed commit failed. Run deploy-app by hand with ref set to DIT_COMMIT of last-good.env."
            exit 1
          fi
          sha="$(tr -d "'" <<<"${record#DIT_COMMIT=}")"
          if [ -z "$sha" ]; then
            echo "::notice::The server has no last-good.env: nothing was deployed, so there is nothing to redeploy."
            exit 0
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The rotation is committed; last-good.env has no valid DIT_COMMIT. Run deploy-app by hand."
            exit 1
          fi
          if ! gh workflow run deploy-app.yml --ref main -f ref="$sha" -f keep_hold=true; then
            echo "::error::The rotation is committed; only dispatching deploy-app failed. Run deploy-app by hand for $sha."
            exit 1
          fi
          echo "Dispatched deploy-app for $sha."
      - name: Clean up
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ssh/ssh_config" ] && [ -n "${STAGE:-}" ]; then
            ssh -F "$RUNNER_TEMP/ssh/ssh_config" dit "rm -rf '$STAGE'" || true
          fi
          rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/env"

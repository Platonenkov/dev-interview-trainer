locales:
  ru:
    title: Что выведет код, в котором лямбды захватывают счётчик цикла for?
    prompt: |
      Что выведет эта программа в консоль? Делегаты вызываются уже после завершения цикла.
    hint: Сколько раз создаётся переменная `i` - на каждой итерации или один раз на весь цикл?
    options:
      a: "012"
      b: "333"
      c: "222"
      d: Ошибка компиляции
    optionExplanations:
      a: Так было бы, если бы каждая итерация получала собственную копию `i`. У счётчика цикла `for` такой копии нет.
      c: Значение 2 было у `i` в теле последней итерации, но лямбды читают переменную в момент вызова, а к этому моменту `i` уже увеличена до 3.
      d: Захват счётчика цикла в лямбде разрешён. Запрещён, например, захват параметров `ref`, `out` и `in`, но обычный счётчик цикла захватить можно.
    answer: "333"
    explanation: |
      Переменная `i` объявляется в инициализаторе цикла `for` один раз и живёт до конца всего цикла, а не создаётся заново
      на каждой итерации. Лямбда захватывает саму переменную, а не её значение на момент создания делегата.
      Цикл останавливается, когда `i < 3` становится ложным, то есть при `i == 3`, поэтому все три делегата
      при вызове читают `3`.

      В цикле `foreach` начиная с C# 5 переменная итерации создаётся заново на каждом проходе, и аналогичный код
      вывел бы `012`. Для `for` поведение исправляют копированием в локальную переменную внутри тела цикла:
      `int copy = i; actions.Add(() => Console.Write(copy));`.
    linkTitles:
      - Лямбда-выражения, захват внешних переменных
      - "Эрик Липперт: Closing over the loop variable considered harmful"
  en:
    title: What does the code print when lambdas capture a for loop counter?
    prompt: |
      What does this program print to the console? The delegates are invoked after the loop has finished.
    hint: How many times is the variable `i` created - once per iteration or once for the whole loop?
    options:
      a: "012"
      b: "333"
      c: "222"
      d: Compile error
    optionExplanations:
      a: That would be true if every iteration got its own copy of `i`. The counter of a `for` loop has no such copy.
      c: "`i` was 2 in the body of the last iteration, but lambdas read the variable when they are invoked, and by then `i` has been incremented to 3."
      d: Capturing a loop counter in a lambda is allowed. What cannot be captured are, for example, `ref`, `out` and `in` parameters, but an ordinary loop counter is fine.
    answer: "333"
    explanation: |
      The variable `i` is declared once in the initializer of the `for` loop and lives for the whole loop; it is not
      created anew on every iteration. A lambda captures the variable itself, not its value at the moment the delegate
      is created. The loop stops when `i < 3` becomes false, that is at `i == 3`, so all three delegates read `3`
      when they run.

      In a `foreach` loop, since C# 5 the iteration variable is created anew on every pass, and equivalent code
      would print `012`. For `for`, the usual fix is to copy the counter into a local variable inside the body:
      `int copy = i; actions.Add(() => Console.Write(copy));`.
    linkTitles:
      - Lambda expressions, capture of outer variables
      - "Eric Lippert: Closing over the loop variable considered harmful"

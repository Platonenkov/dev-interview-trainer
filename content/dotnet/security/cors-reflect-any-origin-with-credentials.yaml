locales:
  ru:
    title: Найдите строку, из-за которой любой сайт читает ответы API с cookie пользователя
    prompt: |
      API на `https://api.example.net` использует аутентификацию по cookie. SPA работает на `https://app.example.com`,
      поэтому cookie настроена для межсайтовых запросов, а SPA вызывает API с `credentials: "include"`. SPA должно
      отправлять cookie, поэтому политика CORS обязана разрешать учётные данные: `AllowCredentials()` - необходимая
      её часть. Команда настроила CORS так, чтобы «SPA просто работало».

      В конфигурации есть уязвимость: любой сайт, который откроет вошедший пользователь, может прочитать его данные
      из `/api/profile`. Щёлкните по строке, которая её создаёт. Код не выполняется: для него нужен ASP.NET Core.
    hint: |
      С чем браузер сравнивает `Access-Control-Allow-Origin` и какое значение он увидит в ответе на запрос с
      произвольной чужой страницы?
    answer: |
      Строка 19, `SetIsOriginAllowed(_ => true)`: вместе с обязательным здесь `AllowCredentials()` она разрешает
      читать ответы с cookie пользователя любому origin.
    explanation: |
      С `SetIsOriginAllowed(_ => true)` CORS middleware считает разрешённым любой origin и записывает `Origin` из
      запроса в `Access-Control-Allow-Origin` (так выглядит и пример ответа на предварительный запрос в документации:
      значение заголовка совпадает с `Origin` запроса), а `AllowCredentials()` добавляет
      `Access-Control-Allow-Credentials: true`. Страница на `https://evil.example` вызывает
      `fetch("https://api.example.net/api/profile", { credentials: "include" })`. Браузер прикладывает cookie жертвы
      (она `SameSite=None`), API отвечает как для жертвы, а раз заголовки разрешают этот origin вместе с учётными
      данными, браузер отдаёт ответ скрипту злоумышленника. Предварительный запрос (preflight) тоже одобряется,
      поэтому злоумышленник может отправлять и JSON-запросы `PUT` и `DELETE` с произвольными заголовками. Атака
      работает в браузерах, которые отправляют сторонние cookie; некоторые браузеры, например Safari, по умолчанию
      их блокируют, но полагаться на это как на защиту нельзя.

      `AllowCredentials()` здесь нужен: без него SPA не получит ответы на запросы с cookie. Опасным его делает
      сочетание с предикатом, который пропускает любой origin, поэтому дефект в строке 19. Документация называет
      разрешение межсайтовых учётных данных риском безопасности, а спецификация CORS запрещает `*` вместе с
      `Access-Control-Allow-Credentials`. `SetIsOriginAllowed(_ => true)` обходит это правило и на деле хуже
      звёздочки: буквальный `*` вместе с учётными данными браузер отклонил бы сам, а отражённый origin он принимает.

      Исправление - явно перечислить доверенные origin: `policy.WithOrigins("https://app.example.com")` с теми же
      `AllowCredentials()` и остальными настройками. Если без предиката не обойтись, сравнивайте разобранный origin
      со списком разрешённых точно, а не через `Contains` или `EndsWith` по строке. Даже при `SameSite=Lax` такая
      политика оставила бы API открытым для любого origin того же сайта, например для взломанного поддомена.
    linkTitles:
      - "Включение CORS в ASP.NET Core"
      - "Работа с cookie SameSite в ASP.NET Core"
  en:
    title: Find the line that lets any website read API responses with the user's cookie
    prompt: |
      The API at `https://api.example.net` uses cookie authentication. The SPA runs at `https://app.example.com`,
      so the cookie is configured for cross-site requests and the SPA calls the API with `credentials: "include"`.
      The SPA must send the cookie, so the CORS policy has to allow credentials: `AllowCredentials()` is a required
      part of it. The team set up CORS so that "the SPA just works".

      The configuration contains a vulnerability: any website that a logged-in user opens can read their data from
      `/api/profile`. Click the line that creates it. The code is not executed: it needs ASP.NET Core.
    hint: |
      What does the browser compare `Access-Control-Allow-Origin` with, and what value will it see in the response
      to a request from an arbitrary foreign page?
    answer: |
      Line 19, `SetIsOriginAllowed(_ => true)`: together with the `AllowCredentials()` call that this setup needs, it
      lets any origin read responses made with the user's cookie.
    explanation: |
      With `SetIsOriginAllowed(_ => true)` the CORS middleware treats every origin as allowed and writes the request's
      `Origin` into `Access-Control-Allow-Origin` (the preflight response example in the documentation looks the same:
      the header value equals the request's `Origin`), and `AllowCredentials()` adds
      `Access-Control-Allow-Credentials: true`. A page on `https://evil.example` calls
      `fetch("https://api.example.net/api/profile", { credentials: "include" })`. The browser attaches the victim's
      cookie (it is `SameSite=None`), the API answers as it would for the victim, and because the headers allow that
      origin with credentials, the browser hands the response to the attacker's script. Preflight requests are
      approved too, so the attacker can also send JSON `PUT` and `DELETE` requests with arbitrary headers. The attack
      works in browsers that send third-party cookies; some browsers, such as Safari, block them by default, but that
      must not be relied on as protection.

      `AllowCredentials()` is needed here: without it the SPA cannot read responses to requests with cookies. What
      makes it dangerous is the combination with a predicate that lets every origin in, so the defect is on line 19.
      The documentation calls allowing cross-origin credentials a security risk, and the CORS specification forbids
      `*` together with `Access-Control-Allow-Credentials`. `SetIsOriginAllowed(_ => true)` sidesteps that rule and is
      in practice worse than a wildcard: the browser itself would reject a literal `*` with credentials, but it
      accepts a reflected origin.

      The fix is to list trusted origins explicitly: `policy.WithOrigins("https://app.example.com")` with the same
      `AllowCredentials()` and other settings. If you really need a predicate, compare the parsed origin with an
      allowlist exactly, not with `Contains` or `EndsWith` on a string. Even with `SameSite=Lax`, this policy would
      still expose the API to any origin of the same site, such as a compromised subdomain.
    linkTitles:
      - "Enable Cross-Origin Requests (CORS) in ASP.NET Core"
      - "Work with SameSite cookies in ASP.NET Core"

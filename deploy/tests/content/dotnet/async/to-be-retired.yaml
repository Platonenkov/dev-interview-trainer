locales:
  ru:
    title: Зачем нужен ConfigureAwait(false) и когда он не нужен?
    prompt: |
      Что делает `ConfigureAwait(false)`, в каком коде его стоит использовать,
      а в каком он ничего не меняет?
    hint: Куда по умолчанию возвращается продолжение после `await`?
    answer: |
      `ConfigureAwait(false)` говорит, что продолжение не обязано возвращаться в захваченный
      `SynchronizationContext` или `TaskScheduler`. Он полезен в библиотечном коде, который не зависит
      от контекста, и снижает риск взаимных блокировок. В ASP.NET Core контекста синхронизации нет,
      поэтому в коде приложения он ничего не меняет.
    explanation: |
      Без `ConfigureAwait(false)` продолжение планируется обратно в захваченный контекст, например в UI-поток.
      Если вызывающий код блокирует этот поток через `.Result`, возникает взаимная блокировка.
      Библиотекам не стоит рассчитывать на контекст вызывающего, а в коде приложения решение зависит от платформы.
    linkTitles:
      - ConfigureAwait FAQ
  en:
    title: A question that tests will retire
    prompt: |
      What does `ConfigureAwait(false)` do, in which code should it be used,
      and where does it change nothing?
    hint: Where does the continuation after `await` run by default?
    answer: |
      `ConfigureAwait(false)` says the continuation does not have to return to the captured
      `SynchronizationContext` or `TaskScheduler`. It is useful in library code that does not depend
      on a context, and it lowers the risk of deadlocks. ASP.NET Core has no synchronization context,
      so in application code it changes nothing there.
    explanation: |
      Without `ConfigureAwait(false)` the continuation is scheduled back to the captured context, for example the UI thread.
      If the caller blocks that thread with `.Result`, a deadlock follows.
      Libraries should not assume the context of the caller; in application code the decision depends on the platform.
    linkTitles:
      - ConfigureAwait FAQ

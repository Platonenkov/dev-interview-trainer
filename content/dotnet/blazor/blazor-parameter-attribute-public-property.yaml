locales:
  ru:
    title: Как родительский компонент Blazor передаёт значение дочернему компоненту?
    prompt: |
      Родительский компонент выводит дочерний компонент `Greeting` и передаёт ему имя (см. код).
      Что должен объявить `Greeting.razor`, чтобы получить значение `"Alice"` в своём коде (.NET 10)?
    hint: Как рендерер узнаёт, какие свойства дочернего компонента можно заполнять из разметки родителя?
    options:
      a: "Закрытое (`private`) свойство `Name` с атрибутом `[Parameter]`"
      b: "Конструктор с параметром `string name`"
      c: "Открытое (`public`) свойство `Name` с атрибутом `[Parameter]`"
      d: "Открытое свойство `Name` без атрибутов: Blazor сопоставляет атрибуты разметки с любыми открытыми свойствами по имени"
    optionExplanations:
      a: "Параметры компонента должны быть открытыми свойствами. Свойство с `[Parameter]`, которое не `public`, не поддерживается: анализатор Blazor предупреждает об этом (BL0004), а значение из разметки родителя в такое свойство не попадёт."
      b: "Экземпляр компонента создаёт сам рендерер, и аргументы конструктора никогда не берутся из атрибутов в разметке родителя. Значения из разметки попадают в компонент только через свойства с `[Parameter]`."
      d: 'Без `[Parameter]` свойство не считается параметром компонента. Blazor не заполняет его из разметки: передача `Name="Alice"` во время выполнения завершится `InvalidOperationException` с сообщением, что у свойства нет атрибута `[Parameter]`.'
    answer: 'Открытое свойство `Name` с атрибутом `[Parameter]`; родитель задаёт значение атрибутом с тем же именем: `Name="Alice"`.'
    explanation: |
      Параметр компонента - это открытое свойство класса компонента с атрибутом `[Parameter]`:
      `[Parameter] public string Name { get; set; } = "";`. Родитель передаёт значение атрибутом с тем же именем:
      литералом (`Name="Alice"`) или выражением C# (`Name="@userName"`).

      Когда родитель отрисовывается, рендерер вызывает у дочернего компонента `SetParametersAsync`, и реализация
      `ComponentBase` по умолчанию записывает переданные значения в свойства с `[Parameter]`. После этого вызываются
      `OnParametersSet{Async}`, а при первой отрисовке значения параметров уже доступны в `OnInitialized{Async}`.

      Из этого механизма следует правило: дочерний компонент не должен сам присваивать значения своим параметрам.
      При следующей отрисовке родителя они будут перезаписаны значениями из его разметки. Если значение нужно
      менять внутри, его копируют в закрытое поле, а изменения сообщают родителю через `EventCallback`.
    linkTitles:
      - "Компоненты Razor в ASP.NET Core"
      - "Жизненный цикл компонентов Razor"
  en:
    title: How does a parent Blazor component pass a value to a child component?
    prompt: |
      A parent component renders the child component `Greeting` and passes it a name (see the code).
      What must `Greeting.razor` declare to receive the value `"Alice"` in its code (.NET 10)?
    hint: How does the renderer know which properties of the child component may be filled from the parent's markup?
    options:
      a: "A `private` property `Name` marked with `[Parameter]`"
      b: "A constructor with a `string name` parameter"
      c: "A `public` property `Name` marked with `[Parameter]`"
      d: "A public property `Name` with no attributes: Blazor matches markup attributes to any public property by name"
    optionExplanations:
      a: "Component parameters must be public properties. A non-`public` `[Parameter]` property is not supported: the Blazor analyzer warns about it (BL0004), and the value from the parent's markup does not reach it."
      b: "The renderer creates the component instance itself, and constructor arguments are never taken from attributes in the parent's markup. Values from markup reach the component only through `[Parameter]` properties."
      d: 'Without `[Parameter]` the property is not a component parameter. Blazor does not fill it from markup: passing `Name="Alice"` fails at run time with an `InvalidOperationException` saying that the property is not marked with `[Parameter]`.'
    answer: 'A public property `Name` marked with `[Parameter]`; the parent sets it with an attribute of the same name: `Name="Alice"`.'
    explanation: |
      A component parameter is a public property of the component class marked with `[Parameter]`:
      `[Parameter] public string Name { get; set; } = "";`. The parent passes a value with an attribute of the same
      name: a literal (`Name="Alice"`) or a C# expression (`Name="@userName"`).

      When the parent renders, the renderer calls `SetParametersAsync` on the child, and the default `ComponentBase`
      implementation writes the passed values into the `[Parameter]` properties. Then `OnParametersSet{Async}` runs,
      and on the first render the parameter values are already available in `OnInitialized{Async}`.

      This mechanism implies a rule: a child component should not assign its own parameters. The next time the
      parent renders, they are overwritten with the values from its markup. If the value must change inside the
      child, copy it into a private field and report changes to the parent through an `EventCallback`.
    linkTitles:
      - "ASP.NET Core Razor components"
      - "ASP.NET Core Razor component lifecycle"

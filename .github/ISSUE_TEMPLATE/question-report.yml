name: Report a problem with a question
description: Tell us what is wrong with a question or its answer.
title: "[question] "
labels: [content-report]
body:
  - type: input
    id: question-id
    attributes:
      label: Question ID
      description: Filled in by the link on the question page.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: Filled in by the link on the question page.
    validations:
      required: true
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: Filled in by the link on the question page.
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: What is the problem?
      options:
        - Wrong answer
        - Unclear wording
        - Outdated
        - Broken link
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should it say instead? Links to sources help.

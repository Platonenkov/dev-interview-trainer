locales:
  ru:
    title: Чем dotnet ef migrations add отличается от dotnet ef database update?
    prompt: |
      Разработчик добавил в сущность `Customer` новое свойство `Email` и выполнил команду
      `dotnet ef migrations add AddCustomerEmail`. Что делает эта команда и чем она отличается от
      `dotnet ef database update`?
    hint: Какая из двух команд меняет схему базы данных, а какая только создаёт файлы в проекте?
    options:
      a: "`migrations add` сразу меняет схему базы, а `database update` только обновляет снимок модели в проекте."
      b: "`migrations add` генерирует файлы миграции по разнице модели и снимка, а `database update` применяет миграции к базе."
      c: "`migrations add` читает схему существующей базы и генерирует по ней классы сущностей и `DbContext`."
      d: "`database update` строит схему прямо по текущей модели, как `EnsureCreated`, без файлов миграций."
    optionExplanations:
      a: "Всё наоборот. `migrations add` не меняет схему базы: эта команда сравнивает модель со снимком, генерирует файлы миграции и сама обновляет снимок в проекте. Применяет миграции к базе как раз `database update`."
      c: Это обратное проектирование (scaffolding) по существующей базе, его выполняет другая команда - `dotnet ef dbcontext scaffold`.
      d: "`database update` применяет к базе миграции, которых ещё нет в таблице `__EFMigrationsHistory`. Изменение модели, не оформленное миграцией, в базу не попадёт."
    answer: "`migrations add` генерирует файлы миграции по разнице модели и снимка, а `database update` применяет миграции к базе."
    explanation: |
      `dotnet ef migrations add AddCustomerEmail` сравнивает текущую модель `DbContext` не со схемой базы данных,
      а со снимком предыдущей модели (файл `{Context}ModelSnapshot.cs` в папке `Migrations`). По найденным
      различиям она генерирует код миграции с методами `Up` и `Down`, файл метаданных миграции и обновлённый
      снимок. Это обычный исходный код: его проверяют на code review и коммитят вместе с изменением модели.

      Схема базы при этом не меняется. Столбец `Email` появится только тогда, когда миграцию применят, например
      командой `dotnet ef database update`. Она подключается к базе, смотрит в таблицу `__EFMigrationsHistory`,
      какие миграции уже применены, выполняет недостающие и записывает их в эту таблицу. Если выполнить только
      `migrations add`, запросы к новому столбцу упадут с ошибкой базы данных.
    linkTitles:
      - "Обзор миграций EF Core"
      - "Справочник по инструментам EF Core для .NET CLI"
  en:
    title: How does dotnet ef migrations add differ from dotnet ef database update?
    prompt: |
      A developer added a new `Email` property to the `Customer` entity and ran
      `dotnet ef migrations add AddCustomerEmail`. What does this command do, and how does it differ from
      `dotnet ef database update`?
    hint: Which of the two commands changes the database schema, and which only creates files in the project?
    options:
      a: "`migrations add` changes the database schema immediately, and `database update` only refreshes the model snapshot in the project."
      b: "`migrations add` generates migration files from the difference between the model and the snapshot, and `database update` applies migrations to the database."
      c: "`migrations add` reads the schema of an existing database and generates entity classes and a `DbContext` from it."
      d: "`database update` builds the schema straight from the current model, like `EnsureCreated`, without migration files."
    optionExplanations:
      a: "It is the other way round. `migrations add` does not change the database schema: it compares the model with the snapshot, generates migration files and updates the snapshot in the project itself. Applying migrations to the database is the job of `database update`."
      c: That is reverse engineering (scaffolding) from an existing database, done by a different command, `dotnet ef dbcontext scaffold`.
      d: "`database update` applies the migrations that are not yet recorded in the `__EFMigrationsHistory` table. A model change that has no migration never reaches the database."
    answer: "`migrations add` generates migration files from the difference between the model and the snapshot, and `database update` applies migrations to the database."
    explanation: |
      `dotnet ef migrations add AddCustomerEmail` compares the current `DbContext` model not with the database
      schema but with a snapshot of the previous model (the `{Context}ModelSnapshot.cs` file in the `Migrations`
      folder). From the differences it generates migration code with `Up` and `Down` methods, a migration
      metadata file and an updated snapshot. This is ordinary source code: it goes through code review and is
      committed together with the model change.

      The database schema does not change. The `Email` column appears only when the migration is applied, for
      example with `dotnet ef database update`. That command connects to the database, checks the
      `__EFMigrationsHistory` table for migrations that were already applied, runs the missing ones and records
      them in that table. If you run only `migrations add`, queries that touch the new column fail with a
      database error.
    linkTitles:
      - "Migrations overview in EF Core"
      - "EF Core tools reference for the .NET CLI"

bugLineSets: [[6]]
fixedSource: |
  using System.Collections.Concurrent;

  ConcurrentBag<int> processed = new();
  List<int> pendingIds = Enumerable.Range(1, 40).Where(id => id % 2 == 1).Select(id => id * id).Where(id => id > 0).OrderByDescending(id => id).Take(10).ToList();

  await Parallel.ForEachAsync(pendingIds, async (id, ct) =>
  {
      await Task.Delay(50, ct);
      processed.Add(id);
  });

  Console.WriteLine(processed.Count);
fixedExpect: { kind: output, value: "10" }

code:
  language: csharp
  harness: none
  source: |
    // Shop.Contracts 1.0.0, a NuGet package shared by many services
    public record OrderPlaced(Guid OrderId, decimal Amount);

    // Shop.Billing, compiled against Shop.Contracts 1.0.0
    public static class BillingHandler
    {
        public static OrderPlaced Handle(OrderPlaced message)
        {
            var (orderId, amount) = message;
            if (message is OrderPlaced(_, > 1000m))
            {
                Console.WriteLine($"Large order {orderId}: {amount}");
            }

            return new OrderPlaced(orderId, -amount);
        }
    }

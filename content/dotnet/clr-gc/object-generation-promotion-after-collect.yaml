code:
  language: csharp
  harness: statements
  source: |
    object data = new object();
    Console.Write(GC.GetGeneration(data));

    GC.Collect();
    Console.Write($" {GC.GetGeneration(data)}");

    GC.Collect();
    Console.Write($" {GC.GetGeneration(data)}");
expect:
  kind: output
  value: "0 1 2"

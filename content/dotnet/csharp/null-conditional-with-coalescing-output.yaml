code:
  language: csharp
  harness: statements
  source: |
    string first = null;
    string second = "abc";

    int a = first?.Length ?? -1;
    int b = second?.Length ?? -1;

    Console.Write($"{a} {b}");
expect:
  kind: output
  value: "-1 3"
acceptedOutputs: ["-1 3"]
options:
  - id: a
    correct: true
    expect: { kind: output, value: "-1 3" }
  - id: b
    correct: false
    expect: { kind: output, value: "0 3" }
  - id: c
    correct: false
    expect: { kind: exception, value: System.NullReferenceException }
  - id: d
    correct: false
    expect: { kind: compile-error }

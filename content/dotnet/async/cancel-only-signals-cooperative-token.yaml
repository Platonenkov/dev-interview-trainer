code:
  language: csharp
  harness: statements
  source: |
    using CancellationTokenSource cts = new();
    int processed = 0;

    async Task ProcessAsync(CancellationToken token)
    {
        for (int i = 0; i < 100; i++)
        {
            await Task.Delay(10);
            processed++;
        }
    }

    Task work = ProcessAsync(cts.Token);
    cts.Cancel();
    await work;
    Console.WriteLine($"{work.Status} {processed}");
options:
  - id: a
    correct: false
  - id: b
    correct: true
  - id: c
    correct: false
  - id: d
    correct: false

locales:
  ru:
    title: Что произойдёт при вызове .Result в обработчике кнопки WinForms?
    prompt: |
      Что произойдёт при нажатии кнопки в этом обработчике WinForms?
    hint: Где должно выполниться продолжение после `await Task.Delay`?
    options:
      a: Обработчик вернёт "done" и обновит метку
      b: Приложение зависнет из-за взаимной блокировки
      c: Будет выброшено исключение `InvalidOperationException`
    optionExplanations:
      a: Так было бы без блокирующего `.Result`. Здесь UI-поток заблокирован ожиданием задачи.
      c: Исключения нет, поток просто ждёт задачу бесконечно.
    answer: Приложение зависнет из-за взаимной блокировки.
    explanation: |
      `.Result` блокирует UI-поток до завершения задачи, а продолжение после `await` должно выполниться
      именно в этом потоке через захваченный `SynchronizationContext`. Каждая сторона ждёт другую.
      Решение: `await LoadAsync()` в асинхронном обработчике.
    linkTitles:
      - Рекомендации по async/await
  en:
    title: What happens when you call .Result in a WinForms button handler?
    prompt: |
      What happens when the button is clicked and this WinForms handler runs?
    hint: Where must the continuation after `await Task.Delay` run?
    options:
      a: The handler returns "done" and updates the label
      b: The application hangs because of a deadlock
      c: An `InvalidOperationException` is thrown
    optionExplanations:
      a: That would be true without the blocking `.Result`. Here the UI thread is blocked waiting for the task.
      c: There is no exception; the thread simply waits for the task forever.
    answer: The application hangs because of a deadlock.
    explanation: |
      `.Result` blocks the UI thread until the task completes, while the continuation after `await` must run
      on that same thread through the captured `SynchronizationContext`. Each side waits for the other.
      The fix is to `await LoadAsync()` in an async handler.
    linkTitles:
      - Async/await best practices

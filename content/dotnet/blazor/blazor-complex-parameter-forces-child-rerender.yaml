    @* Parent.razor *@
    <button @onclick="() => clicks++">Clicks: @clicks</button>
    <ProductCard Product="product" />

    @code {
        private int clicks;
        private readonly Product product = new() { Name = "Pen" };
    }

    @* ProductCard.razor *@
    <p>@Product.Name</p>

    @code {
        [Parameter] public Product Product { get; set; } = default!;

        protected override void OnAfterRender(bool firstRender)
            => Console.WriteLine("ProductCard rendered");
    }

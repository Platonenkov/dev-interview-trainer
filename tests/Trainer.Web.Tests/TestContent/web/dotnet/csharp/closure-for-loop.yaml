locales:
  ru:
    title: Что выведет код с лямбдами, захватившими переменную цикла for?
    prompt: |
      Что выведет этот код в консоль?
    hint: Сколько переменных `i` существует в цикле `for`?
    options:
      a: "012"
      b: "333"
      c: "222"
    optionExplanations:
      a: Так было бы, если бы каждая итерация получала собственную копию `i`. В цикле `for` это не так.
      c: Лямбды выполняются после завершения цикла, когда `i` уже равна 3, а не 2.
    answer: "333"
    explanation: |
      Переменная `i` в цикле `for` объявляется один раз на весь цикл, и все лямбды захватывают
      именно её, а не значение. К моменту вызова цикл завершён и `i` равна 3.
      В `foreach` компилятор создаёт новую переменную на каждой итерации, поэтому там результат был бы другим.
    linkTitles:
      - Лямбда-выражения, захват внешних переменных
  en:
    title: What does the code print when lambdas capture a for loop variable?
    prompt: |
      What does this code print to the console?
    hint: How many `i` variables exist in a `for` loop?
    options:
      a: "012"
      b: "333"
      c: "222"
    optionExplanations:
      a: That would be true if every iteration got its own copy of `i`. A `for` loop does not do that.
      c: The lambdas run after the loop ends, when `i` is already 3, not 2.
    answer: "333"
    explanation: |
      The `i` variable of a `for` loop is declared once for the whole loop, and every lambda captures
      that variable, not its value. By the time the lambdas run, the loop is over and `i` is 3.
      A `foreach` loop creates a fresh variable per iteration, so it would behave differently.
    linkTitles:
      - Lambda expressions, capture of outer variables
